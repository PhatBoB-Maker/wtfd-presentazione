<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline A: un responsabile per FMOD e Unreal</title>
  <desc id="desc">La task e i file audio approvati passano a un unico responsabile, che prepara FMOD, integra in Unreal, prova il risultato e consegna su Perforce.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".26"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9da7b7"/></marker>
    <style>
      .title{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#f6f4ef}.subtitle{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#aeb7c5}.owner{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#fff}.step{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#c6ced9;letter-spacing:.08em}.head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#fff}.body{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#c4cbd5}.meta{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#f1aa67;letter-spacing:.04em}.number{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#0c1017}.arrow{fill:none;stroke:#9da7b7;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="540" rx="24" fill="#0b0f16"/>
  <text class="title" x="40" y="52">Pipeline A · Un responsabile per FMOD e Unreal</text>
  <text class="subtitle" x="40" y="82">La stessa persona prende in carico tutta la parte tecnica, dalle bank alla verifica nel gioco.</text>

  <rect x="474" y="112" width="686" height="52" rx="12" fill="#b85f2d"/>
  <text class="owner" x="817" y="144" text-anchor="middle">UNICO RESPONSABILE · FMOD + UNREAL · ARCHIVI AUDIO E PERFORCE</text>
  <path d="M560 164V187M817 164V187M1074 164V187" stroke="#d68a58" stroke-width="2"/>

  <path class="arrow" d="M236 314H267"/><path class="arrow" d="M461 314H492"/><path class="arrow" d="M686 314H717"/><path class="arrow" d="M911 314H942"/>

  <g filter="url(#shadow)"><rect x="40" y="205" width="196" height="220" rx="14" fill="#1b222d"/></g>
  <circle cx="70" cy="237" r="15" fill="#c7d0dc"/><text class="number" x="70" y="242" text-anchor="middle">1</text>
  <text class="step" x="96" y="241">ASSEGNAZIONE</text>
  <text class="head" x="62" y="282"><tspan x="62">Task e brief</tspan><tspan x="62" dy="25">di produzione</tspan></text>
  <text class="body" x="62" y="347"><tspan x="62">Obiettivo, riferimenti,</tspan><tspan x="62" dy="21">responsabile e priorità.</tspan></text>
  <text class="meta" x="62" y="397">NOTION</text>

  <g filter="url(#shadow)"><rect x="265" y="205" width="196" height="220" rx="14" fill="#1b222d"/></g>
  <circle cx="295" cy="237" r="15" fill="#c7d0dc"/><text class="number" x="295" y="242" text-anchor="middle">2</text>
  <text class="step" x="321" y="241">APPROVAZIONE</text>
  <text class="head" x="287" y="282"><tspan x="287">WAV o stem</tspan><tspan x="287" dy="25">approvati</tspan></text>
  <text class="body" x="287" y="347"><tspan x="287">File, LOOKDEV e feedback</tspan><tspan x="287" dy="21">pronti per la parte tecnica.</tspan></text>
  <text class="meta" x="287" y="397">HUB + DRIVE</text>

  <g filter="url(#shadow)"><rect x="490" y="187" width="196" height="256" rx="14" fill="#2a1b16"/></g>
  <circle cx="520" cy="219" r="15" fill="#f1aa67"/><text class="number" x="520" y="224" text-anchor="middle">3</text>
  <text class="step" x="546" y="223">FMOD</text>
  <text class="head" x="512" y="264"><tspan x="512">Eventi, parametri</tspan><tspan x="512" dy="25">e bank</tspan></text>
  <text class="body" x="512" y="329"><tspan x="512">Importa i file, prepara</tspan><tspan x="512" dy="21">i comportamenti, prova</tspan><tspan x="512" dy="21">e genera le bank.</tspan></text>
  <text class="meta" x="512" y="414">FMOD · VERSIONI</text>

  <g filter="url(#shadow)"><rect x="715" y="187" width="196" height="256" rx="14" fill="#172333"/></g>
  <circle cx="745" cy="219" r="15" fill="#77a9df"/><text class="number" x="745" y="224" text-anchor="middle">4</text>
  <text class="step" x="771" y="223">UNREAL</text>
  <text class="head" x="737" y="264"><tspan x="737">Bank e collegamenti</tspan><tspan x="737" dy="25">al gameplay</tspan></text>
  <text class="body" x="737" y="329"><tspan x="737">Inserisce le bank e collega</tspan><tspan x="737" dy="21">eventi e parametri agli</tspan><tspan x="737" dy="21">stati del gioco.</tspan></text>
  <text class="meta" x="737" y="414">UNREAL + PERFORCE</text>

  <g filter="url(#shadow)"><rect x="940" y="187" width="220" height="256" rx="14" fill="#1b222d"/></g>
  <circle cx="970" cy="219" r="15" fill="#c7d0dc"/><text class="number" x="970" y="224" text-anchor="middle">5</text>
  <text class="step" x="996" y="223">VERIFICA E CONSEGNA</text>
  <text class="head" x="962" y="264"><tspan x="962">Prova nel gioco</tspan><tspan x="962" dy="25">e submit</tspan></text>
  <text class="body" x="962" y="329"><tspan x="962">Controlla il risultato,</tspan><tspan x="962" dy="21">invia le modifiche e registra</tspan><tspan x="962" dy="21">esito e changelist.</tspan></text>
  <text class="meta" x="962" y="414">PERFORCE + NOTION</text>

  <rect x="40" y="478" width="1120" height="1" fill="#303846"/>
  <text class="subtitle" x="40" y="512">Passaggio fra FMOD e Unreal: interno alla stessa persona, senza una consegna intermedia.</text>
</svg>
