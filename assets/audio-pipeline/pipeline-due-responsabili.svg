<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline B: due responsabili separati</title>
  <desc id="desc">La task e i file approvati passano al responsabile FMOD, che consegna un pacchetto completo al responsabile Unreal. Quest’ultimo integra, prova e consegna su Perforce.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".26"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9da7b7"/></marker>
    <style>
      .title{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#f6f4ef}.subtitle{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#aeb7c5}.owner{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#fff}.step{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#c6ced9;letter-spacing:.07em}.head{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#fff}.body{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#c4cbd5}.meta{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#f1aa67;letter-spacing:.035em}.number{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#0c1017}.arrow{fill:none;stroke:#9da7b7;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0b0f16"/>
  <text class="title" x="40" y="52">Pipeline B · Due responsabili separati</text>
  <text class="subtitle" x="40" y="82">FMOD e Unreal hanno responsabili distinti: il passaggio delle bank diventa una consegna obbligatoria.</text>

  <rect x="420" y="112" width="174" height="50" rx="12" fill="#b85f2d"/><text class="owner" x="507" y="142" text-anchor="middle">PERSONA A · FMOD</text>
  <rect x="810" y="112" width="174" height="50" rx="12" fill="#326a9f"/><text class="owner" x="897" y="142" text-anchor="middle">PERSONA B · UNREAL</text>
  <path d="M507 162V187M897 162V187" stroke="#9da7b7" stroke-width="2"/>

  <path class="arrow" d="M203 314H223"/><path class="arrow" d="M393 314H413"/><path class="arrow" d="M583 314H603"/><path class="arrow" d="M773 314H793"/><path class="arrow" d="M963 314H983"/>

  <g filter="url(#shadow)"><rect x="30" y="205" width="173" height="220" rx="14" fill="#1b222d"/></g>
  <circle cx="58" cy="235" r="14" fill="#c7d0dc"/><text class="number" x="58" y="240" text-anchor="middle">1</text><text class="step" x="82" y="239">ASSEGNAZIONE</text>
  <text class="head" x="50" y="280"><tspan x="50">Task e brief</tspan></text>
  <text class="body" x="50" y="324"><tspan x="50">Obiettivo, riferimenti,</tspan><tspan x="50" dy="20">responsabile e priorità.</tspan></text>
  <text class="meta" x="50" y="397">NOTION</text>

  <g filter="url(#shadow)"><rect x="220" y="205" width="173" height="220" rx="14" fill="#1b222d"/></g>
  <circle cx="248" cy="235" r="14" fill="#c7d0dc"/><text class="number" x="248" y="240" text-anchor="middle">2</text><text class="step" x="272" y="239">APPROVAZIONE</text>
  <text class="head" x="240" y="280"><tspan x="240">WAV o stem</tspan><tspan x="240" dy="23">approvati</tspan></text>
  <text class="body" x="240" y="344"><tspan x="240">File, LOOKDEV e feedback</tspan><tspan x="240" dy="20">pronti per FMOD.</tspan></text>
  <text class="meta" x="240" y="397">HUB + DRIVE</text>

  <g filter="url(#shadow)"><rect x="410" y="187" width="173" height="256" rx="14" fill="#2a1b16"/></g>
  <circle cx="438" cy="217" r="14" fill="#f1aa67"/><text class="number" x="438" y="222" text-anchor="middle">3</text><text class="step" x="462" y="221">FMOD</text>
  <text class="head" x="430" y="262"><tspan x="430">Eventi, parametri</tspan><tspan x="430" dy="23">e bank</tspan></text>
  <text class="body" x="430" y="324"><tspan x="430">Prepara, prova e genera</tspan><tspan x="430" dy="20">le bank da consegnare.</tspan></text>
  <text class="meta" x="430" y="415">FMOD · VERSIONI</text>

  <g filter="url(#shadow)"><rect x="600" y="173" width="173" height="284" rx="14" fill="#30291d"/></g>
  <circle cx="628" cy="203" r="14" fill="#e5bf72"/><text class="number" x="628" y="208" text-anchor="middle">4</text><text class="step" x="652" y="207">CONSEGNA</text>
  <text class="head" x="620" y="248"><tspan x="620">Pacchetto FMOD</tspan><tspan x="620" dy="23">completo</tspan></text>
  <text class="body" x="620" y="310"><tspan x="620">Bank</tspan><tspan x="620" dy="20">Versione FMOD</tspan><tspan x="620" dy="20">Eventi e parametri</tspan><tspan x="620" dy="20">Note sulle modifiche</tspan></text>
  <text class="meta" x="620" y="429">HUB + DRIVE</text>

  <g filter="url(#shadow)"><rect x="790" y="187" width="173" height="256" rx="14" fill="#172333"/></g>
  <circle cx="818" cy="217" r="14" fill="#77a9df"/><text class="number" x="818" y="222" text-anchor="middle">5</text><text class="step" x="842" y="221">UNREAL</text>
  <text class="head" x="810" y="262"><tspan x="810">Bank e collegamenti</tspan><tspan x="810" dy="23">al gameplay</tspan></text>
  <text class="body" x="810" y="324"><tspan x="810">Inserisce, collega e prova</tspan><tspan x="810" dy="20">il risultato nel gioco.</tspan></text>
  <text class="meta" x="810" y="415">UNREAL + PERFORCE</text>

  <g filter="url(#shadow)"><rect x="980" y="205" width="190" height="220" rx="14" fill="#1b222d"/></g>
  <circle cx="1008" cy="235" r="14" fill="#c7d0dc"/><text class="number" x="1008" y="240" text-anchor="middle">6</text><text class="step" x="1032" y="239">VERIFICA</text>
  <text class="head" x="1000" y="280"><tspan x="1000">Prova e submit</tspan></text>
  <text class="body" x="1000" y="324"><tspan x="1000">Esito della prova,</tspan><tspan x="1000" dy="20">modifiche e changelist.</tspan></text>
  <text class="meta" x="1000" y="397">PERFORCE + NOTION</text>

  <rect x="40" y="492" width="1120" height="1" fill="#303846"/>
  <text class="subtitle" x="40" y="526">Passaggio fra persone: la Persona B può integrare soltanto dopo aver ricevuto il pacchetto completo dalla Persona A.</text>
</svg>
