Un uomo anziano è fermo davanti a un ceppo, l'ascia sollevata a metà del prossimo colpo. Si è fermato senza voltarsi del tutto — ha sentito i passi di Rinaldo nel fango prima ancora di vederlo.`, en: `He follows the sound until the fog shows him what's making it: a low farmhouse, its roof patched more than once with mismatched materials, a small barn leaning against one side. Thin smoke from a crooked chimney. A small vegetable patch, kept just alive enough, not a thread more.

An old man stands before a stump, axe raised halfway through the next swing. He has stopped without fully turning around — he heard Rinaldo's footsteps in the mud before he even saw him.` } },
      { img: 'assets/storia/scena17/panel-03.jpg', text: { it: `*[BA]"Chi sei."* Non è una domanda, è un'accusa vestita da domanda. L'ascia resta dov'è, ferma a mezz'aria, i muscoli dell'avambraccio ancora tesi come se il colpo potesse ripartire in qualsiasi istante. Negli occhi del vecchio non c'è paura — solo un calcolo silenzioso, lo sguardo di chi ha imparato a misurare un pericolo prima ancora di sapere se lo è davvero. Rinaldo resta immobile, a distanza, e per un momento nessuno dei due sembra intenzionato a essere il primo a muoversi.`, en: `*[BA]"Who are you."* It isn't a question, it's an accusation dressed as one. The axe stays where it is, frozen mid-air, the muscles of his forearm still tensed as if the blow could resume at any instant. There's no fear in the old man's eyes — only a silent calculation, the look of someone who has learned to measure a danger before even knowing whether it is one. Rinaldo stays still, at a distance, and for a moment neither of them seems willing to be the first to move.` } },
      { img: 'assets/storia/scena17/panel-04.jpg', text: { it: `*[R]"Un viandante."* Rinaldo tiene le mani visibili, lontane dalla lama alla cintura. *[R]"Non voglio niente che sia tuo. Ho visto il fumo."*

Il vecchio lo guarda a lungo — non il volto, prima: le mani, i vestiti, il modo in cui sta in piedi. Quello che vede sembra bastargli, o forse è solo troppo stanco per continuare a diffidare. Abbassa l'ascia, la infila nel ceppo con un colpo secco che la lascia dritta, piantata.

*[BA]"Non ho niente da offrirti. Un fuoco, se ti basta."*

Si siedono fuori, vicino al ceppo — il vecchio non lo invita dentro, e Rinaldo non chiede.

*[R]"Vivi solo, qui."*

*[BA]"Da un pezzo."* Guarda il fuoco che ha acceso in una piccola fossa di pietre, non Rinaldo. *[BA]"Il villaggio è a mezza giornata da qui. Non ci vado, se posso evitarlo."*

*[R]"Perché?"*

Silenzio. Poi: *[BA]"Sei tu quello della donna bruciata."* Non è crudele — è solo un fatto che gli è arrivato, e che ha riconosciuto. *[BA]"La notizia arriva anche qui, alla fine. Sempre in ritardo, ma arriva."*

Rinaldo non nega. *[R]"Sì."*

*[BA]"E cerchi cosa. Vendetta? Una risposta?"*

*[R]"Non lo so più."* La stessa risposta che ha dato all'eremita, e lo sorprende scoprire quanto sia ancora vera. *[R]"Voglio solo capire cosa è successo davvero. A lei. Ai miei figli."*

Il vecchio annuisce, piano, come se quella risposta gli avesse tolto qualcosa da addosso invece di aggiungerlo. Passa un momento lungo, in cui l'unico suono è il fuoco.`, en: `*[R]"A traveler."* Rinaldo keeps his hands visible, away from the blade at his belt. *[R]"I want nothing that's yours. I saw the smoke."*

The old man studies him for a long moment — not the face, first: the hands, the clothes, the way he stands. Whatever he sees seems to be enough, or maybe he's simply too tired to keep distrusting. He lowers the axe, sinks it into the stump with a sharp blow that leaves it standing straight.

*[BA]"I have nothing to offer you. A fire, if that's enough."*

They sit outside, near the stump — the old man doesn't invite him in, and Rinaldo doesn't ask.

*[R]"You live alone, here."*

*[BA]"For a good while now."* He looks at the fire he's lit in a small ring of stones, not at Rinaldo. *[BA]"The village is half a day from here. I don't go, if I can help it."*

*[R]"Why?"*

Silence. Then: *[BA]"You're the one with the burned woman."* It isn't cruel — it's simply a fact that reached him, and that he recognized. *[BA]"News gets here too, eventually. Always late, but it gets here."*

Rinaldo doesn't deny it. *[R]"Yes."*

*[BA]"And you're looking for what. Revenge? An answer?"*

*[R]"I don't know anymore."* The same answer he gave the hermit, and he's surprised to find it's still true. *[R]"I just want to understand what really happened. To her. To my children."*

The old man nods, slowly, as if that answer had taken something off him instead of adding to it. A long moment passes, in which the only sound is the fire.` } },
      { img: 'assets/storia/scena17/panel-05.jpg', text: { it: `*[R]"Vivi così lontano da tutti solo per le voci del villaggio?"*

Il vecchio non risponde subito. Lo sguardo gli scivola per un istante in una direzione precisa, oltre la spalla di Rinaldo — non un posto qualunque, un punto che conosce a memoria — poi torna al fuoco. Le spalle si alzano di un niente, le mani si fermano sulle ginocchia.

*[BA]"No."* Una pausa. *[BA]"C'è un posto, poco più a valle. Non ci si passa per caso, da queste parti — se sei arrivato da quella direzione, ci sei passato anche tu."*

*[R]"Una stanza di pietra. Un inginocchiatoio consumato. Un'iscrizione."*

Il vecchio chiude gli occhi un istante, come per sopportare un peso che sapeva sarebbe arrivato prima o poi.

*[BA]"Allora l'hai vista."* Non è una domanda.`, en: `*[R]"Do you live this far from everyone just because of the village talk?"*

The old man doesn't answer right away. His gaze slips for an instant toward a precise direction, past Rinaldo's shoulder — not just any place, a spot he knows by heart — then returns to the fire. His shoulders rise a fraction, his hands go still on his knees.

*[BA]"No."* A pause. *[BA]"There's a place, a little further down the valley. You don't pass it by chance, around here — if you came from that direction, you passed it too."*

*[R]"A stone room. A worn kneeler. An inscription."*

The old man closes his eyes for a moment, as if bracing for a weight he knew would come sooner or later.

*[BA]"Then you've seen it."* It isn't a question.` } },
      { img: 'assets/storia/scena17/panel-06.jpg', text: { it: `Il silenzio si allunga, pesante quanto il primo. Quando riprende a parlare, la voce gli è cambiata — più bassa, più lenta.

*[BA]"L'ho costruito io. Quel muro, quel tetto — con le mie mani, tanti anni fa."* Una pausa. *[BA]"Per lei. Perché non sapevo dove altro metterla — nessun convento, nessun prete voleva saperne — e non potevo lasciarla fuori, esposta al freddo e al villaggio, come si lascia un animale che nessuno vuole più toccare, qualunque cosa avesse fatto."*

*[R]"Chi era?"*

*[BA]"Mia moglie."* Il nome gli esce come se lo tenesse chiuso da tempo, con cura, per non consumarlo. *[BA]"Agnese."*

Rinaldo aspetta. Non fa altre domande — ha imparato, con l'eremita, che certe cose vanno lasciate arrivare da sole, o non arrivano affatto.

*[BA]"Ero un soldato."* Guarda le proprie mani — nodose, segnate, mani che hanno tenuto un'arma molto più a lungo di quanto Rinaldo abbia mai tenuto la sua. *[BA]"Vent'anni a portare la spada per il mio signore, da prima che nascessero i bambini. Tu curi le ferite. Io le ho sempre fatte — quello mi ha insegnato il mestiere, non a salvare nessuno."* Una pausa. *[BA]"Un giorno è arrivata voce, al villaggio, che ero morto in battaglia. Non ero io — un altro caduto, un nome confuso con il mio nella fretta di contare i corpi. Ci ho messo settimane a saperlo, e altrettante a tornare a casa."* Il fuoco scoppietta nel silenzio che segue. *[BA]"Lei l'ha saputo prima di me. E ci ha creduto."*`, en: `The silence stretches out, just as heavy as the first. When he speaks again, his voice has changed — lower, slower.

*[BA]"I built it myself. That wall, that roof — with my own hands, many years ago."* A pause. *[BA]"For her. Because I didn't know where else to put her — no convent, no priest would take her — and I couldn't leave her out there, exposed to the cold and to the village, the way you leave an animal no one wants to touch anymore, whatever she'd done."*

*[R]"Who was she?"*

*[BA]"My wife."* The name comes out of him as if he'd kept it shut away for a long time, carefully, so as not to wear it out. *[BA]"Agnese."*

Rinaldo waits. He asks nothing else — he's learned, with the hermit, that certain things have to arrive on their own, or they don't arrive at all.

*[BA]"I was a soldier."* He looks at his own hands — gnarled, marked, hands that held a weapon far longer than Rinaldo has ever held his. *[BA]"Twenty years carrying a sword for my lord, since before the children were born. You tend wounds. I always made them — that's what the trade taught me, not how to save anyone."* A pause. *[BA]"One day, word reached the village that I'd died in battle. It wasn't me — another man fallen, a name confused with mine in the rush to count the bodies. It took me weeks to learn of it, and just as many to get home."* The fire crackles in the silence that follows. *[BA]"She learned before I did. And she believed it."*` } },
      { img: 'assets/storia/scena17/panel-07.jpg', text: { it: `Il vecchio si ferma. Rinaldo non lo spinge a continuare — ma il silenzio stesso, questa volta, è già una risposta che nessuno dei due vuole dire a voce alta.

*[BA]"Non so cosa le sia passato per la testa quella notte, e ho smesso di cercare di saperlo tanti inverni fa."* La voce gli trema, appena, per la prima volta. *[BA]"So solo che li amava. Che mi amava. E che qualcosa, in lei, in quella notte, si è rotto in un modo che io non ho mai visto rompersi in nessun altro. Non un mostro. Non una strega. Solo... rotta."*

*[R]"E i bambini—"* Rinaldo non riesce a finire la domanda.

*[BA]"Non sono usciti dall'acqua."* Detto piatto, senza colore, come una frase ripetuta così tante volte da aver smesso di fare male nel modo in cui fa male la prima volta. *[BA]"Lei sì. Qualcuno l'ha tirata fuori, non so chi, non l'ho mai chiesto. È vissuta ancora tanti anni, dopo. Il villaggio non l'ha uccisa — l'hanno lasciata vivere, in penitenza, in quel posto. Forse era peggio che ucciderla. Non lo so."*`, en: `The old man stops. Rinaldo doesn't push him to continue — but the silence itself, this time, is already an answer neither of them wants to say out loud.

*[BA]"I don't know what went through her head that night, and I stopped trying to know many winters ago."* His voice shakes, just slightly, for the first time. *[BA]"I only know she loved them. That she loved me. And that something in her, that night, broke in a way I've never seen break in anyone else. Not a monster. Not a witch. Just... broken."*

*[R]"And the children—"* Rinaldo can't finish the question.

*[BA]"They didn't come out of the water."* Said flat, without color, like a sentence repeated so many times it has stopped hurting the way it hurts the first time. *[BA]"She did. Someone pulled her out, I don't know who, I never asked. She lived on for many years after that. The village didn't kill her — they let her live, in penance, in that place. Maybe it was worse than killing her. I don't know."*` } },
      { img: 'assets/storia/scena17/panel-08.jpg', text: { it: `*[R]"L'hai abbandonata?"*

Il vecchio scuote la testa, piano, ma non con la certezza di chi nega una colpa. *[BA]"Non ho più potuto chiamarla mia moglie. Non dopo. Non riuscivo nemmeno a guardarla senza vedere anche l'altra cosa, quella notte, sovrapposta a tutto il resto."* Una pausa lunga. *[BA]"Ma non me ne sono andato del tutto. Le portavo cibo, una coperta quando l'inverno si faceva duro. Certe volte mi sedevo fuori dal Sacello, in silenzio, per ore, senza entrare. Lei sapeva che ero lì. Non parlavamo quasi mai."* Un'altra pausa, più pesante. *[BA]"Sono rimasto vicino a lei, in un modo, fino al giorno in cui è morta. Solo mai abbastanza vicino da poterla chiamare ancora mia moglie. Non so se questo conta come esserci stato, o come un altro modo di abbandonarla."*

*[R]"E tu, adesso?"*

*[BA]"Io non sono più tornato in quella casa. E non potevo nemmeno stare nel villaggio, dove ogni faccia che incontravo sapeva, e mi guardava sapendo."* Alza gli occhi su Rinaldo, per la prima volta da un po'. *[BA]"Tu capisci questo, credo. Meglio di chiunque altro io abbia incontrato."*

*[R]"Perché mi racconti questo?"* chiede infine Rinaldo.

*[BA]"Perché hai gli occhi di uno che sta ancora decidendo se la sua donna sia un mostro o solo qualcuno che amava troppo per reggere quello che le è successo intorno."* Una pausa. *[BA]"Io non ho una risposta per te. Ma so che quelle due cose, a volte, sono la stessa persona."*

Rinaldo si alza. Il vecchio non lo trattiene — annuisce una volta, e torna al ceppo, all'ascia, al ritmo ostinato che lo ha portato fin qui.`, en: `*[R]"Did you abandon her?"*

The old man shakes his head, slowly, but not with the certainty of someone denying a guilt. *[BA]"I couldn't call her my wife anymore. Not after. I couldn't even look at her without seeing that other thing too, that night, laid over everything else."* A long pause. *[BA]"But I never left entirely. I brought her food, a blanket when winter turned hard. Sometimes I'd sit outside the shrine, in silence, for hours, without going in. She knew I was there. We hardly ever spoke."* Another pause, heavier. *[BA]"I stayed close to her, in a way, until the day she died. Just never close enough to call her my wife again. I don't know if that counts as having stayed, or as just another way of abandoning her."*

*[R]"And you, now?"*

*[BA]"I never went back to that house. And I couldn't stay in the village either, where every face I met knew, and looked at me knowing."* He raises his eyes to Rinaldo, for the first time in a while. *[BA]"You understand this, I think. Better than anyone else I've met."*

*[R]"Why are you telling me this?"* Rinaldo finally asks.

*[BA]"Because you have the eyes of a man still deciding whether his woman is a monster, or just someone who loved too much to bear what happened around her."* A pause. *[BA]"I don't have an answer for you. But I know that those two things, sometimes, are the same person."*

Rinaldo gets up. The old man doesn't hold him back — he nods once, and returns to the stump, to the axe, to the stubborn rhythm that brought him this far.` } },
      { img: 'assets/storia/scena17/panel-09.jpg', text: { it: `Cammina senza una direzione precisa, finché il casolare e il fumo non sono più che una macchia grigia dietro di lui. Si ferma quando le gambe smettono di rispondergli come dovrebbero. Non è stanchezza. È il peso di ogni parola del vecchio che si è sistemato da qualche parte dentro il petto e adesso pretende spazio, tutto insieme, senza permesso.

*[R]"Anche lei mi amava,"* pensa, e la frase gli si ripete da sola, con la voce di Bastiano invece che con la propria. *Amava anche i suoi figli. Ed è bastato un attimo, una notizia sbagliata, una paura più grande di quanto un cuore possa reggere.*

Scivola a sedere contro un albero, le ginocchia al petto, e per la prima volta da quando è entrato nella nebbia piange senza cercare di fermarsi.

*[R]"Beatrice,"* dice, a voce alta, a nessuno, alla nebbia. *[R]"Beatrice, dimmi che non l'hai fatto anche tu."*`, en: `He walks without any clear direction, until the farmhouse and the smoke are nothing more than a grey smear behind him. He stops when his legs stop answering the way they should. It isn't tiredness. It's the weight of every word the old man said, settled somewhere inside his chest and now demanding space, all at once, without permission.

*[R]"She loved me too,"* he thinks, and the sentence repeats itself on its own, in Bastiano's voice instead of his own. *She loved her children too. And it took only a moment, a piece of wrong news, a fear bigger than a heart can hold.*

He slides down to sit against a tree, knees to his chest, and for the first time since entering the fog he cries without trying to stop.

*[R]"Beatrice,"* he says, aloud, to no one, to the fog. *[R]"Beatrice, tell me you didn't do it too."*` } },
      { img: 'assets/storia/scena17/panel-10.jpg', text: { it: `Il campanellino, contro il suo fianco, comincia a scaldarsi — non il calore secco del sole sulla pelle, ma qualcosa di più vivo, quasi un battito che sale piano dal metallo fin dentro le costole. Rinaldo lo sente prima ancora di accorgersene, la mano che si muove da sola verso la bisaccia, come se il corpo ricordasse il gesto meglio della mente.`, en: `The campanellino, against his side, begins to grow warm — not the dry warmth of sun on skin, but something more alive, almost a pulse rising slowly from the metal into his ribs. Rinaldo feels it before he's even aware of it, his hand moving on its own toward the pouch, as if his body remembered the gesture better than his mind did.` } },
      { img: 'assets/storia/scena17/panel-11.jpg', text: { it: `Non è come le altre volte — non un lampo che arriva e se ne va prima che lui possa afferrarlo. Il calore cresce piano, costante, finché l'aria davanti a lui non comincia a piegarsi in una forma che conosce.

Lei è lì prima ancora che lui smetta di piangere abbastanza da vederla bene. Questa volta, però, non aspetta. Si china verso di lui — il gesto di qualcuno che si inginocchia accanto a chi soffre.

*"Cosa c'è."* Nella voce c'è un'urgenza che non aveva mai avuto prima. *"Perché piangi così."*

*[R]"Dicono—"* Si ferma. Ricomincia. *[R]"Al villaggio dicono che hai ucciso i nostri figli. Con le tue mani."* La voce gli si spezza sull'ultima parola. *[R]"Ho appena sentito una storia — una donna, come te, che amava suo marito e i suoi figli più di ogni altra cosa, e che comunque... Non so più a chi credere, Beatrice."*

Il silenzio che segue dura più di quanto Rinaldo riesca a sopportare. Quando lei parla, la voce non ha la fermezza di chi nega qualcosa che sa di aver fatto — ha lo smarrimento di chi viene accusata di un delitto in una lingua che non conosce.

*"Non lo so. Non ricordo — non ricordo di aver fatto una cosa simile. Non riuscirei mai—"* La voce si incrina, non di colpa, ma di un dolore genuino, di chi si trova improvvisamente estranea a sé stessa. *"Perché mi chiedi questo? Perché mi guardi come se avessi paura di me?"*

Rinaldo non risponde. Non riesce.

E allora, invece di una risposta che nessuno dei due può darsi, il mondo intorno a lui comincia a cedere — non si dissolve nel nulla, si riempie.`, en: `It isn't like the other times — not a flash that arrives and leaves before he can hold onto it. The warmth grows slowly, steadily, until the air in front of him begins to bend into a shape he knows.

She's there before he's even stopped crying enough to see her clearly. This time, though, she doesn't wait. She leans toward him — the gesture of someone kneeling beside a person in pain.

*"What is it."* There's an urgency in her voice she's never had before. *"Why are you crying like this."*

*[R]"They say—"* He stops. Starts again. *[R]"At the village they say you killed our children. With your own hands."* His voice breaks on the last word. *[R]"I just heard a story — a woman, like you, who loved her husband and her children more than anything else, and who still... I don't know who to believe anymore, Beatrice."*

The silence that follows lasts longer than Rinaldo can bear. When she speaks, her voice doesn't have the steadiness of someone denying something she knows she did — it has the bewilderment of someone accused of a crime in a language she doesn't know.

*"I don't know. I don't remember — I don't remember doing anything like that. I could never—"* Her voice cracks, not with guilt, but with genuine pain, the pain of someone suddenly a stranger to herself. *"Why are you asking me this? Why are you looking at me as if you were afraid of me?"*

Rinaldo doesn't answer. He can't.

And so, instead of an answer neither of them can give, the world around him begins to give way — it doesn't dissolve into nothing, it fills.` } },
      { img: 'assets/storia/scena17/panel-12.jpg', text: { it: `*[LP]La cascata, di notte, molto prima dei bambini. L'acqua fredda contro le caviglie, il rumore che copre ogni altra cosa. Beatrice ride di qualcosa che lui ha detto — non lo ricorda più cosa, solo il suono di quella risata sopra il rumore dell'acqua, e la sua mano che cerca la sua nel buio senza bisogno di guardare per trovarla. La luna sulla superficie che si spezza in mille pezzi ogni volta che uno dei due si muove.*

Rinaldo sente il freddo dell'acqua come se fosse ancora lì dentro, come se il corpo ricordasse quello che la mente aveva quasi lasciato andare.`, en: `*[LP]The waterfall, at night, long before the children. The cold water against their ankles, the roar covering everything else. Beatrice laughs at something he said — he no longer remembers what, only the sound of that laugh over the noise of the water, and her hand finding his in the dark without needing to look for it. The moon on the surface breaking into a thousand pieces every time one of them moves.*

Rinaldo feels the cold of the water as if he were still in it, as if his body remembered what his mind had almost let go of.` } },
      { img: 'assets/storia/scena17/panel-13.jpg', text: { it: `*[LP]Poi un picnic d'estate, anni dopo, all'ombra di un salice vicino al lago. Beatrice stende un plaid sull'erba, Rinaldo apre il cesto — pane, formaggio, quel poco che serve. Isabella e Ludovico giocano poco distante, un cerchio di legno spinto e guidato con un bastone, la corsa dietro di esso che si fa gara ogni volta che uno dei due lo lascia cadere. Beatrice li guarda un istante, sorride, poi torna a ridere di qualcosa che Rinaldo ha appena detto — il sole caldo sulle spalle, l'ombra del salice che si muove appena col vento, niente da fare per un pomeriggio intero se non restare lì.*`, en: `*[LP]Then a summer picnic, years later, in the shade of a willow near the lake. Beatrice spreads a blanket on the grass, Rinaldo opens the basket — bread, cheese, just what's needed. Isabella and Ludovico play a little way off, a wooden hoop pushed and guided with a stick, the chase after it turning into a race every time one of them lets it fall. Beatrice watches them for a moment, smiles, then goes back to laughing at something Rinaldo has just said — the warm sun on their shoulders, the willow's shade stirring faintly in the wind, nothing to do for an entire afternoon but stay there.*` } },
      { img: 'assets/storia/scena17/panel-14.jpg', text: { it: `*[LP]Beatrice che intreccia i capelli di Isabella davanti al fuoco, canticchiando.*`, en: `*[LP]Beatrice braiding Isabella's hair by the fire, humming to herself.*` } },
      { img: 'assets/storia/scena17/panel-15.jpg', text: { it: `*[LP]Ludovico addormentato contro il suo fianco durante un temporale, la mano di lei che non smette di accarezzargli la testa nemmeno quando pensa che nessuno la guardi.*`, en: `*[LP]Ludovico asleep against her side during a storm, her hand never stopping its slow stroke through his hair even when she thinks no one is watching.*` } },
      { img: 'assets/storia/scena17/panel-16.jpg', text: { it: `*[LP]Poi, l'ultima immagine, la più quieta di tutte: tutti e quattro addormentati nello stesso letto, in una notte che non ricorda quale — Isabella di traverso ai piedi, Ludovico rannicchiato contro il fianco di Beatrice, e le mani, tutte e quattro le mani, sovrapposte e intrecciate senza ordine sopra la coperta, come se anche nel sonno nessuno dei quattro avesse voluto smettere di toccare gli altri.*`, en: `*[LP]Then, the last image, the quietest of all: all four of them asleep in the same bed, on a night he can't place — Isabella sideways across the foot of the bed, Ludovico curled against Beatrice's side, and the hands, all four sets of hands, overlapping and loosely laced together on top of the blanket, as if even in sleep none of the four had wanted to stop touching the others.*` } },
      { img: 'assets/storia/scena17/panel-17.jpg', text: { it: `Rinaldo non riesce più a distinguere cosa sta vedendo da cosa sta sentendo nel proprio corpo — il petto gli si stringe non di dolore, questa volta, ma di qualcosa che gli assomiglia e basta.

*Questo,* pensa, e per la prima volta da quando è entrato nella nebbia non è un pensiero-rifugio, non è una speranza che si costringe a credere. È una certezza che gli sale dal corpo prima ancora che dalla mente, la stessa certezza con cui si riconosce il proprio nome. *Questa donna non avrebbe mai fatto del male a un solo capello dei suoi figli. Qualunque cosa sia successa quella notte, non è mai stata questo.*

Il ricordo si sfalda, lentamente, come una carezza che si ritira invece di essere strappata via. Lei torna a fuoco davanti a lui, la forma già più sottile, più stanca — ma per la prima volta da quando è comparsa, Rinaldo non ha più paura di quello che potrebbe dirgli.

*"Non so rispondere alla tua domanda,"* dice lei, piano. *"Ma qualunque cosa tu abbia appena visto — era vero. Tutto quello era vero."*

*[R]"Lo so,"* dice Rinaldo, e per la prima volta da quando ha pronunciato quella domanda, la sua voce non trema.

Si dissolve piano, non di scatto — come se, questa volta, si stesse congedando invece di essere strappata via.`, en: `Rinaldo can no longer tell what he's seeing from what he's feeling in his own body — his chest tightens, not with pain this time, but with something that merely resembles it.

*This,* he thinks, and for the first time since he entered the fog it isn't a thought he's taking refuge in, isn't a hope he's forcing himself to believe. It's a certainty that rises from his body before it even reaches his mind, the same certainty with which one recognizes one's own name. *This woman would never have harmed a single hair on her children's heads. Whatever happened that night, it was never this.*

The memory unravels, slowly, like a caress withdrawing instead of being torn away. She comes back into focus before him, her form already thinner, more tired — but for the first time since she appeared, Rinaldo is no longer afraid of what she might tell him.

*"I can't answer your question,"* she says, quietly. *"But whatever you just saw — it was true. All of it was true."*

*[R]"I know,"* Rinaldo says, and for the first time since he asked that question, his voice doesn't shake.

She dissolves slowly, not abruptly — as if, this time, she were taking her leave rather than being torn away.` } },
      { img: 'assets/storia/scena17/panel-18.jpg', text: { it: `Rinaldo resta seduto contro l'albero ancora a lungo, il campanellino che si raffredda piano contro il palmo. Non piange più. Non è sollevato — è solo più pieno di quanto fosse un'ora prima, di amore e paura nella stessa misura, senza che l'una riesca a cancellare l'altra.

Si rialza quando il corpo, di nuovo, glielo permette. Riprende a camminare, verso qualunque cosa lo aspetti ancora oltre la nebbia.`, en: `Rinaldo stays sitting against the tree for a long while still, the campanellino slowly cooling against his palm. He isn't crying anymore. He isn't relieved — he's only fuller than he was an hour ago, with love and fear in equal measure, neither one able to erase the other.

He gets up when his body, once again, allows it. He starts walking again, toward whatever still waits for him beyond the fog.` } }
    ]
  },
  {
    id: 'S18',
    title: { it: 'Scena 18 — Il Camposanto', en: 'Scene 18 — The Burial Ground' },
    panels: [
      { img: 'assets/storia/scena18/panel-01.jpg', text: { it: `Cammina più a lungo del solito senza che il campanellino dica niente — non il silenzio pesante di dopo il Sacello, solo l'assenza ordinaria di chi non ha nulla da segnalare. Il terreno qui si fa più cedevole, l'erba alta e ingiallita che nasconde buche piene d'acqua stagnante. La nebbia si è abbassata di nuovo, quasi al livello del petto, e sotto quella linea il mondo è più nitido del solito: pietre, radici, un muretto crollato che un tempo doveva segnare un confine.

Il muretto lo conduce, senza che lui lo decida davvero, verso qualcosa di più regolare del terreno intorno — file di piccoli rialzi nell'erba, troppo ordinati per essere naturali, troppo piccoli per essere tombe di adulti.`, en: `He walks longer than usual without the campanellino saying anything — not the heavy silence of after the Sacello, just the ordinary absence of something with nothing to signal. The ground here grows softer, tall yellowed grass hiding pools of standing water. The fog has dropped low again, almost to chest height, and beneath that line the world is sharper than usual: stones, roots, a collapsed dry-stone wall that must once have marked a boundary.

The wall leads him, without his really deciding to follow it, toward something more regular than the ground around it — rows of small mounds in the grass, too orderly to be natural, too small to be adult graves.` } },
      { img: 'assets/storia/scena18/panel-02.jpg', text: { it: `Sono una ventina, forse meno — è difficile contarli con l'erba che li inghiotte a metà. Ogni rialzo ha una pietra alla testa, non scolpita, solo scelta con cura per la forma piatta e per stare in piedi da sola. Su alcune, incisi con una mano che ha fatto lo stesso gesto molte volte, ci sono segni che non sono lettere — tacche, croci semplici, un cerchio che potrebbe essere un sole o niente del tutto.`, en: `There are perhaps twenty, maybe fewer — hard to count with the grass swallowing them halfway. Each mound has a stone at its head, unworked, chosen only for its flat shape and its ability to stand on its own. On some, carved by a hand that has made the same gesture many times, there are marks that aren't letters — notches, simple crosses, a circle that could be a sun or nothing at all.` } },
      { img: 'assets/storia/scena18/panel-03.jpg', text: { it: `Su una sola pietra, più grande delle altre e posta al centro come se dovesse parlare per tutte, c'è una scritta vera. Poche righe, incise profonde, la mano ferma di chi ha imparato a scrivere per un mestiere e non per sé.

*"Presi dall'aria malsana che sale dalla palude, nell'anno del Signore — . Che Dio li accolga, poiché la terra non li ha voluti restituire."*

Rinaldo resta fermo più a lungo di quanto vorrebbe. Non sono i suoi. Lo sa con certezza — nessuna di quelle pietre porta nomi che riconosce, e la terra sotto di esse è vecchia, assestata da anni, non da mesi. Ma è la prima volta che vede cosa succede, alla fine, a chi la palude si prende. Non sparizioni. Non un dubbio che resta aperto per sempre come il suo. Una fila di pietre e una scritta che chiude la domanda una volta per tutte.

*Presi. E poi non restituiti. Mai.*

Il pensiero gli arriva intero, senza che lo cerchi, e per un momento smette di respirare nel modo giusto. Se questo è quello che succede — se questa è la fine di ogni bambino che la nebbia si porta via — allora non c'è nessuna porta gentile in cui rifugiarsi, nessun *forse dormivano* a cui aggrapparsi. Solo pietre, ordinate in file, con un'aria malsana a fare da scusa a qualcosa che nessuno vuole nominare per intero.`, en: `On a single stone, larger than the others and set at the center as if it had to speak for all of them, there is real writing. A few lines, deeply carved, the steady hand of someone who learned to write for a trade, not for himself.

*"Taken by the unhealthy air that rises from the marsh, in the year of our Lord — . May God receive them, since the earth would not give them back."*

Rinaldo stays still longer than he'd like. They aren't his. He knows it for certain — none of those stones bears a name he recognizes, and the ground beneath them is old, settled by years, not months. But it's the first time he's seen what happens, in the end, to whoever the marsh takes. Not disappearances. Not a doubt that stays open forever, like his own. A row of stones and an inscription that closes the question once and for all.

*Taken. And never given back. Ever.*

The thought arrives whole, without his seeking it, and for a moment he forgets how to breathe properly. If this is what happens — if this is the end of every child the fog carries off — then there's no gentle door to take refuge in, no *maybe they were only sleeping* to cling to. Only stones, arranged in rows, with unhealthy air standing in as an excuse for something no one wants to name in full.` } },
      { img: 'assets/storia/scena18/panel-04.jpg', text: { it: `*[LP]Una corda, tesa nel buio, che non finisce mai di srotolarsi. Lungo di essa, a intervalli, piccole forme legate ai polsi — alcune immobili, il peso morto di chi non lotta più. Altre si muovono ancora: si dimenano, tirano contro il nodo, una gamba che scalcia nel vuoto. Non si vede dove la corda porti. Non si vede chi la tiene. Solo il contrasto, per un solo istante prima che tutto si richiuda nel buio: forme ferme, e forme che lottano ancora.*

Il campanellino gli batte una volta contro il fianco — non il colpo secco d'avvertimento di prima, qualcosa di più simile a un sussulto, come se anche lui avesse visto la stessa cosa. Rinaldo si allontana dalla pietra, il fiato ancora corto, senza sapere se quello che ha appena visto sia una speranza o solo un'altra domanda senza risposta.`, en: `*[LP]A cord, taut in the dark, that never finishes unspooling. Along its length, at intervals, small shapes tied at the wrists — some motionless, the dead weight of those who no longer struggle. Others still move: writhing, pulling against the knot, one leg kicking at empty air. Where the cord leads cannot be seen. Who holds it cannot be seen. Only the contrast, for a single instant before it all closes back into darkness: still shapes, and shapes still fighting.*

The campanellino strikes once against his side — not the sharp warning blow from before, something closer to a start, as if it too had seen the same thing. Rinaldo steps back from the stone, breath still short, not knowing whether what he's just seen is hope or only one more question without an answer.` } },
      { img: 'assets/storia/scena18/panel-05.jpg', text: { it: `Non si accorge subito di quando il calore comincia — è già dentro di lui, allo stesso modo in cui ci si accorge di essere stati al sole solo quando si entra all'ombra. Poi lei è lì, seduta sul muretto crollato come se fosse sempre stata quel posto ad aspettarla, la forma translucida che il vento della palude attraversa senza spostarla di un capello.

*"Le hai viste,"* dice, e non è una domanda.`, en: `He doesn't notice right away when the warmth begins — it's already inside him, the same way you only notice you've been in the sun once you step into shade. Then she's there, seated on the collapsed wall as if that place had always been waiting for her, her translucent form passed through by the marsh wind without a hair of it moving.

*"You saw them,"* she says, and it isn't a question.` } },
      { img: 'assets/storia/scena18/panel-06.jpg', text: { it: `*[R]"Un cimitero. Bambini."* La voce gli esce più ruvida di quanto vorrebbe. *[R]"C'è scritto che la palude li ha presi e non li ha mai restituiti."* Una pausa che gli costa. *[R]"Se è vero per loro—"*

Non finisce la frase. Non serve.

*"Non lo so,"* dice lei, ed è la prima volta che lo ammette così apertamente, senza cercare di addolcirlo. *"Non so cosa sia vero per quelle pietre."* Si volta verso di lui, e per un istante l'espressione che porta è più vicina alla sua di quanto la nebbia dovrebbe permettere. *"Ma io credo ancora — non so da dove venga questa certezza, so solo che non se n'è mai andata — che per i miei non sia davvero finita. Che esistano ancora, da qualche parte, in un modo che non saprei spiegare."* Le mani, aperte in grembo, si stringono senza chiudersi davvero, come se cercassero qualcosa che non hanno più la solidità per afferrare. *"Non posso dimostrartelo. Non riesco nemmeno a dimostrarlo a me stessa. Ma se io posso ancora crederci, dopo tutto quello che sono adesso—"*

*[R]"Allora posso farlo anch'io,"* finisce lui, piano.

Lei annuisce, e per un momento nessuno dei due dice altro. Non è una promessa. Nessuno dei due ha niente da promettere. È solo due persone che si tengono in piedi sulla stessa fede, senza terreno sotto.`, en: `*[R]"A graveyard. Children."* His voice comes out rougher than he'd like. *[R]"It's written that the marsh took them and never gave them back."* A pause that costs him. *[R]"If it's true for them—"*

He doesn't finish the sentence. He doesn't need to.

*"I don't know,"* she says, and it's the first time she's admitted it this openly, without trying to soften it. *"I don't know what's true for those stones."* She turns toward him, and for a moment the expression she wears is closer to human than the fog should allow. *"But I still believe — I don't know where this certainty comes from, only that it has never left me — that it isn't truly over for mine. That they still exist, somewhere, in some way I couldn't explain."* Her hands, open in her lap, curl without quite closing, as if reaching for something they no longer have the solidity to hold. *"I can't prove it to you. I can't even prove it to myself. But if I can still believe it, after everything I am now—"*

*[R]"Then so can I,"* he finishes, quietly.

She nods, and for a moment neither says anything more. It isn't a promise. Neither of them has anything left to promise. It's only two people standing upright on the same faith, with no ground beneath them.` } },
      { img: 'assets/storia/scena18/panel-07.jpg', text: { it: `Il vento cambia prima che il suono arrivi — una raffica secca, improvvisa, che non ha nulla del movimento lento a cui la nebbia li ha abituati. Il campanellino comincia a oscillare contro il fianco di Rinaldo senza direzione, un colpo caldo e poi subito dopo freddo, come se non riuscisse a decidere cosa segnalare.

Beatrice si irrigidisce a metà di un respiro. Volta la testa verso un punto oltre le spalle di Rinaldo, e per la prima volta da quando è comparsa nella sua vita da spirito, quello che le attraversa il viso non è tristezza. È paura.

*"No,"* dice, la voce già più sottile. *"No, non ora — la nebbia... sta arrivando."*`, en: `The wind changes before the sound arrives — a dry, sudden gust, nothing like the slow drift the fog has accustomed them to. The campanellino begins swinging against Rinaldo's side with no direction, one beat warm and then immediately cold, as if it can't decide what to signal.

Beatrice stiffens mid-breath. She turns her head toward a point beyond Rinaldo's shoulder, and for the first time since she appeared in his life as a spirit, what crosses her face isn't sorrow. It's fear.

*"No,"* she says, her voice already thinner. *"No, not now — the fog... it's coming."*` } },
      { img: 'assets/storia/scena18/panel-08.jpg', text: { it: `Non fa in tempo a chiedere altro. Qualcosa la tira via — non un gesto suo, non una scelta: la forma di lei si allunga per un istante come acqua risucchiata da uno scarico, i bordi che si sfilacciano in filamenti di nebbia mentre il resto di lei viene trascinato all'indietro. Si aggrappa a qualcosa che non esiste, le dita che stringono aria, la bocca aperta su una parola che non arriva a formarsi del tutto. Poi non c'è più niente sul muretto crollato — solo un vortice di nebbia che gira su se stesso per un istante e poi si distende, piatto e silenzioso come se non fosse mai stato altro.`, en: `He doesn't have time to ask anything else. Something pulls her away — not a gesture of her own, not a choice: her form stretches for an instant like water pulled down a drain, its edges fraying into strands of fog as the rest of her is dragged backward. She grasps at something that isn't there, fingers closing on air, her mouth open on a word that never quite forms. Then there's nothing left on the collapsed wall — only a small vortex of fog spinning once on itself before flattening out, level and silent, as if it had never been anything else.` } },
      { img: 'assets/storia/scena18/panel-09.jpg', text: { it: `La nebbia che si era distesa comincia a addensarsi di nuovo, non più intorno a lui ma davanti — una colonna che si solidifica lentamente in una forma che Rinaldo conosce già anche se non l'ha mai vista così vicina. Il cappuccio. L'assenza di proporzioni sotto di esso. E stavolta non si muove.

Ferma, a una ventina di passi, orientata verso di lui in un modo che nessun avvistamento precedente aveva mai avuto — non di passaggio, non indifferente. Rivolta a lui.`, en: `The fog that had flattened out begins to thicken again, no longer around him but ahead — a column slowly solidifying into a shape Rinaldo already knows, even though he's never seen it this close. The hood. The absence of proportions beneath it. And this time it isn't moving.

Still, some twenty paces off, oriented toward him in a way no previous sighting ever was — not passing through, not indifferent. Facing him.` } },
      { img: 'assets/storia/scena18/panel-10.jpg', text: { it: `Rinaldo fa per indietreggiare, e in quel momento sente qualcosa chiudersi intorno alle caviglie — non mani, non corde: la nebbia stessa, addensata al punto da avere una presa, artigli fatti della stessa sostanza di tutto il resto, che gli si stringono intorno ai polsi quando alza le braccia d'istinto per difendersi. Non stringe fino a far male. Stringe fino a immobilizzare, il corpo intero bloccato in piedi come un insetto in una ragnatela che non si vede.`, en: `Rinaldo tries to step back, and in that instant feels something close around his ankles — not hands, not ropes: the fog itself, thickened enough to have a grip, claws made of the same substance as everything else, closing around his wrists when he raises his arms on instinct to defend himself. It doesn't squeeze hard enough to hurt. It squeezes enough to immobilize, his whole body locked upright like an insect in a web that can't be seen.` } },
      { img: 'assets/storia/scena18/panel-11.jpg', text: { it: `La Borda si avvicina con lo stesso passo innaturale di sempre, né lento né rapido, finché non è abbastanza vicina da riempire tutto quello che Rinaldo riesce a vedere. Sotto il cappuccio non c'è niente che assomigli a un volto — solo buio, più fitto di qualunque ombra dovrebbe essere. Ma quando alza una mano verso di lui, Rinaldo la vede per intero per la prima volta: verrucosa, la pelle grigia e spaccata come corteccia vecchia, le dita troppo lunghe per essere umane e troppo umane per essere altro. Il volto resta comunque invisibile — non un'ombra qualunque, ma qualcosa di più simile a una coltre di tenebre tirata sopra ciò che avrebbe dovuto essere un viso.`, en: `The Borda draws closer with the same unnatural gait as always, neither slow nor fast, until she's close enough to fill everything Rinaldo can see. Beneath the hood there's nothing resembling a face — only darkness, denser than any shadow has a right to be. But when she raises a hand toward him, Rinaldo sees it fully for the first time: warty, the skin grey and cracked like old bark, the fingers too long to be human and too human to be anything else. The face stays hidden all the same — not an ordinary shadow, but something closer to a shroud of darkness drawn over what should have been a face.` } },
      { img: 'assets/storia/scena18/panel-12.jpg', text: { it: `La mano non lo tocca. Scende verso il fianco, dove il campanellino pende da un'asola di cuoio vicino alla cintura, e si posa su di esso con una delicatezza che non si aspettava da niente di quella cosa.

Non succede niente che Rinaldo riesca a nominare. Nessun calore, nessun freddo — solo, per un istante lunghissimo, la sensazione che due cose che non si sono mai toccate prima si stiano riconoscendo, senza che nessuna delle due sappia perché.

*[R]"Lascia stare,"* dice, e non è quello che voleva dire — è quello che gli esce, la voce già rotta a metà della frase. *[R]"Lasciala stare—"* Si dimena contro gli artigli di nebbia, senza risultato, il corpo che tira in ogni direzione possibile mentre la mente resta un passo indietro, incapace di formare un pensiero più lungo di un grido. *[R]"LASCIALA STARE!!"*`, en: `The hand doesn't touch him. It descends toward his side, where the campanellino hangs from a leather loop near his belt, and settles on it with a gentleness he wouldn't have expected from anything about that creature.

Nothing happens that Rinaldo can name. No warmth, no cold — only, for one very long instant, the sensation of two things that have never touched before recognizing each other, without either of them knowing why.

*[R]"Leave it,"* he says, and it isn't what he meant to say — it's what comes out, his voice already breaking halfway through. *[R]"Leave her alone—"* He struggles against the claws of fog, without result, his body pulling in every possible direction while his mind stays a step behind, unable to form a thought longer than a scream. *[R]"LEAVE HER ALONE!!"*` } },
      { img: 'assets/storia/scena18/panel-13.jpg', text: { it: `Dietro di lei, nella nebbia che si è aperta per farla passare, Rinaldo vede la corda — quella di poco prima, tesa e persa nel bianco in entrambe le direzioni. E per la prima volta sente, più che vedere, cosa vi è appeso: voci, sottili e lontanissime, come se venissero da sotto l'acqua. Bambini che piangono. Bambini che chiamano una madre che non arriva.

Qualcosa in Rinaldo si spezza nello stesso momento in cui la presa intorno ai polsi si fa, per un solo istante, più stretta.`, en: `Behind her, in the fog that has parted to let her through, Rinaldo sees the cord — the one from before, taut and lost in the white in both directions. And for the first time he hears, more than sees, what hangs from it: voices, thin and very distant, as if coming from underwater. Children crying. Children calling for a mother who never comes.

Something in Rinaldo breaks in the same instant the grip around his wrists tightens, for a single moment, harder.` } },
      { img: 'assets/storia/scena18/panel-14.jpg', text: { it: `Poi vede — o crede di vedere, non ne sarà mai del tutto certo — due delle piccole forme sulla corda muoversi in un modo che le altre non fanno. Non il dondolio del vento. Un movimento proprio, cocciuto, di chi lotta contro un nodo che non vuole cedere.

*[R]"Ludovico,"* grida, il nome che gli esce dalla gola come se non fosse mai stato altro che questo, pronto ad aspettare otto mesi solo per essere urlato in questo istante. *[R]"Isabella! Ridammeli indietro, maledetta! RIDAMMELI INDIETRO!!"*`, en: `Then he sees — or believes he sees, he'll never be entirely certain — two of the small shapes on the cord moving in a way the others don't. Not the sway of the wind. A movement of their own, stubborn, of someone fighting a knot that won't give.

*[R]"Ludovico,"* he screams, the name tearing out of his throat as if it had never been anything else, ready to wait eight months only to be shouted in this one instant. *[R]"Isabella! Give them back to me, damn you! GIVE THEM BACK!!"*` } },
      { img: 'assets/storia/scena18/panel-15.jpg', text: { it: `La Borda non risponde. Non un suono, non un movimento che assomigli a una reazione — per un lungo istante resta immobile, la mano ancora posata sul campanellino, il cappuccio rivolto verso Rinaldo come se lo stesse osservando attraverso un buio che vede più di quanto dovrebbe.

Poi ritira la mano, si volta, e comincia a camminare verso la corda.

Si ferma davanti a una delle piccole forme legate, quella che si è dimenata più delle altre. Non si china. Alza un piede — lento, quasi indifferente, lo stesso passo con cui attraversa qualunque altra cosa nella nebbia — e lo abbassa.

Per un solo istante, il movimento apre uno squarcio nella nebbia bassa intorno ai loro piedi, abbastanza perché Rinaldo veda: acqua stagnante, poco profonda, nera di fango. Una piccola forma, un sacco di iuta grezza legato sul capo a coprire ogni tratto, spinta sotto la superficie dal peso di quel piede. Bolle che salgono, fitte, poi più rade, poi niente. Il fango che si richiude sopra come se non fosse mai stato smosso.`, en: `The Borda doesn't answer. Not a sound, not a movement resembling a reaction — for a long instant she stays motionless, her hand still resting on the campanellino, the hood turned toward Rinaldo as if watching him through a darkness that sees more than it should.

Then she withdraws her hand, turns, and starts walking toward the cord.

She stops in front of one of the small tied shapes, the one that struggled the most. She doesn't bend down. She raises a foot — slow, almost indifferent, the same gait with which she crosses everything else in the fog — and lowers it.

For a single instant, the motion tears a gap in the low fog around their feet, just enough for Rinaldo to see: shallow standing water, black with mud. A small shape, a rough burlap sack tied over its head, covering every feature, pushed under the surface by the weight of that foot. Bubbles rising, thick, then thinner, then none. The mud closing back over it as if it had never been disturbed.` } },
      { img: 'assets/storia/scena18/panel-16.jpg', text: { it: `La nebbia si richiude sulla scena. La Borda si allontana, lo stesso passo di sempre, verso la brughiera — e mentre si dissolve nel bianco, per la prima volta in tutto il viaggio di Rinaldo, produce un suono che non è né passo né silenzio. Una risata. Bassa, sbagliata, qualcosa che nella gola di una persona vera non potrebbe mai uscire così.

Gli artigli di nebbia intorno ai polsi e alle caviglie di Rinaldo si sciolgono nello stesso istante in cui lei si volta — troppo tardi per fare qualsiasi cosa, anche se avesse saputo cosa fare. Cade in avanti sulle ginocchia, libero e inutile allo stesso tempo.`, en: `The fog closes back over the scene. The Borda moves off, the same pace as always, toward the open moor — and as she dissolves into the white, for the first time in Rinaldo's entire journey, she makes a sound that is neither footstep nor silence. A laugh. Low, wrong, something that could never come out of a real person's throat like that.

The claws of fog around Rinaldo's wrists and ankles dissolve in the same instant she turns — too late to do anything, even if he'd known what to do. He falls forward onto his knees, free and useless at the same time.` } },
      { img: 'assets/storia/scena18/panel-17.jpg', text: { it: `Si trascina verso il punto, più che camminarci, le mani che affondano nel fango e nell'erba alta cercando qualcosa che sa già di dover trovare. Le dita incontrano stoffa bagnata prima ancora degli occhi — piccola, fradicia, immobile in un modo che il corpo di Rinaldo riconosce da medico prima ancora che la mente voglia saperlo.

Lo solleva dall'acqua bassa con entrambe le braccia, un gesto che ha fatto altre volte, per altri bambini, in un'altra vita — mai per uno che non respira più. Il sacco di iuta è ancora legato sul capo, un nodo semplice, contadino. Le mani gli tremano troppo per provare a slegarlo — e in un angolo di sé, quello che resta lucido, sa che non ha bisogno di vedere il viso per fare quello che deve fare adesso.

Cerca con le dita, non con gli occhi. Un polso. Una manica. Qualcosa che possa dirgli quello che ha bisogno e insieme teme di sapere.`, en: `He drags himself toward the spot more than walks it, hands sinking into mud and tall grass, searching for something he already knows he has to find. His fingers meet wet cloth before his eyes do — small, sodden, still in a way his body recognizes as a physician before his mind wants to know it.

He lifts it from the shallow water with both arms, a gesture he's made before, for other children, in another life — never for one who no longer breathes. The burlap sack is still tied over its head, a simple, peasant knot. His hands shake too much to try untying it — and in some corner of himself that stays clear, he knows he doesn't need to see the face to do what he has to do now.

He searches with his fingers, not his eyes. A wrist. A sleeve. Something that can tell him what he both needs and dreads to know.` } },
      { img: 'assets/storia/scena18/panel-18.jpg', text: { it: `Non è la stoffa di casa sua. Non è la manica che ha visto Beatrice rammendare cento volte, seduta vicino al fuoco. Non è niente che riconosca.

*Non è mio.*

Il sollievo lo attraversa prima che riesca a fermarlo — intero, fisico, una vertigine di gratitudine che gli scioglie le spalle per un solo istante prima che il resto di lui capisca cosa ha appena provato.

E allora arriva l'altra cosa, più lenta ma più pesante: ha in braccio un bambino morto, annegato da qualcosa che l'ha guardato negli occhi un momento prima, e la prima cosa vera che ha sentito è stato sollievo — perché non era il suo. Non vergogna per quello che è successo. Vergogna per quello che ha provato lui, vivo, con quel peso ancora caldo tra le braccia.`, en: `It isn't the cloth from his own house. It isn't the sleeve he's watched Beatrice mend a hundred times, sitting by the fire. It isn't anything he recognizes.

*Not mine.*

Relief moves through him before he can stop it — whole, physical, a rush of gratitude that loosens his shoulders for one single instant before the rest of him understands what he's just felt.

And then the other thing arrives, slower but heavier: he's holding a dead child, drowned by something that looked him in the eyes a moment ago, and the first true thing he felt was relief — because it wasn't his own. Not shame for what happened. Shame for what he felt, alive, with that still-warm weight in his arms.` } },
      { img: 'assets/storia/scena18/panel-19.jpg', text: { it: `Non sa a chi appartenga. Non lo saprà mai — nessun nome, nessuna famiglia da cercare in un villaggio che forse non esiste più. Lo posa di nuovo a terra, con più cura di quanta il momento richieda, sistema il sacco di iuta perché resti come l'ha trovato, e resta inginocchiato accanto per un tempo che non sa contare.

Quando si rialza, le gambe gli reggono a stento. Il campanellino, ancora appeso alla cintura, è tiepido sotto le sue dita quando lo cerca senza deciderlo — non caldo, non freddo, solo presente, come se avesse assistito a tutto senza avere niente da dire.

*Se lei è ancora qui,* pensa, e il pensiero arriva prima che riesca a fermarlo, prima ancora di sapere se ha il diritto di pensarlo dopo quello che ha appena visto. *Se un pezzo di lei può restare, dopo il rogo, dopo tutto — allora forse uccidere quella cosa non la cancella. Forse la libera.*

Non lo sa. Non ha modo di saperlo. Ma per la prima volta da quando è entrato nella nebbia, la rabbia contro la Borda ha smesso di essere solo rabbia per i suoi figli. È diventata anche qualcos'altro — una domanda che non osa dire ad alta voce nemmeno a se stesso, perché se la risposta fosse no, non sa cosa gli resterebbe per continuare a camminare.

Si rialza quando le gambe tornano a reggerlo, il camposanto alle sue spalle, la corda e le voci — e quel piccolo corpo, e quel sollievo che non riesce a perdonarsi — già un ricordo che non sa se si fiderà mai abbastanza da raccontare a qualcuno. Davanti a lui, la nebbia continua, uguale a sempre — indifferente a quello che gli ha appena mostrato.`, en: `He doesn't know whose it is. He'll never know — no name, no family to search for in a village that may no longer exist. He lays it back down, with more care than the moment requires, arranges the burlap sack to sit as he found it, and stays kneeling beside it for a length of time he can't count.

When he gets up, his legs barely hold him. The campanellino, still hanging from his belt, is lukewarm under his fingers when he reaches for it without deciding to — not warm, not cold, only present, as if it had witnessed everything and had nothing to say about it.

*If she's still here,* he thinks, and the thought arrives before he can stop it, before he even knows whether he has the right to think it after what he's just seen. *If a piece of her can remain, after the pyre, after everything — then maybe killing that thing doesn't erase her. Maybe it frees her.*

He doesn't know. He has no way of knowing. But for the first time since he entered the fog, his rage against the Borda has stopped being only rage for his children. It has become something else too — a question he doesn't dare say aloud even to himself, because if the answer were no, he doesn't know what would be left to keep him walking.

He rises when his legs can hold him again, the burial ground behind him, the cord and the voices — and that small body, and that relief he can't forgive himself for — already a memory he doesn't know if he'll ever trust himself to tell anyone. Ahead of him, the fog goes on, the same as always — indifferent to what it has just shown him.` } }
    ]
  },
  {
    id: 'S19',
    title: { it: 'Scena 19 — Lo Strappo', en: 'Scene 19 — The Tearing' },
    panels: [
      { img: 'assets/storia/scena19/panel-01.jpg', text: { it: `Non sa più contare i giorni. Il campanellino, da quando ha lasciato il camposanto alle spalle, non ha più avuto un solo momento di silenzio vero — un'oscillazione continua, caldo e freddo che si rincorrono così in fretta da non essere più due segnali distinti ma un unico tremore costante contro il fianco, come un battito che non è il suo. Non l'ha mai fatto così a lungo.

La nebbia, intorno a lui, ha smesso di somigliare a quella che ha attraversato fino a qui. Più densa in certi punti, quasi assente in altri, come se qualcosa sotto di essa stesse respirando in modo irregolare. Il terreno sale, appena, verso un crinale basso che la nebbia non copre mai del tutto — l'unico punto, in tutto il suo cammino, dove riesce a vedere per un istante cosa c'è oltre il bianco: altra nebbia, ancora più fitta, addensata su se stessa come acqua intorno a una pietra.

Non sa dire perché cammina verso quel punto. Sa solo che non riuscirebbe a fermarsi anche se lo volesse.`, en: `He's lost count of the days. The campanellino, ever since he left the burial ground behind, hasn't had a single moment of real silence — a continuous oscillation, warm and cold chasing each other so fast they're no longer two distinct signals but one constant tremor against his side, like a heartbeat that isn't his own. It has never done this for so long.

The fog around him has stopped resembling anything he's crossed so far. Denser in some places, almost absent in others, as if something beneath it were breathing unevenly. The ground rises, just slightly, toward a low ridge the fog never fully covers — the one point, in his whole journey, where he can see for an instant what lies beyond the white: more fog, denser still, thickened in on itself like water around a stone.

He can't say why he's walking toward that point. He only knows he couldn't stop himself even if he wanted to.` } },
      { img: 'assets/storia/scena19/panel-02.jpg', text: { it: `Il campanellino comincia a tremare contro il fianco prima ancora che lui superi il crinale — non l'oscillazione blanda di questi ultimi giorni, qualcosa di più simile a un battito impazzito, come se sapesse qualcosa che lui non sa ancora.

La radura che si apre oltre il crinale non assomiglia a nessun altro punto attraversato finora. L'erba è marcia, piegata su se stessa in cerchi che non hanno una ragione per esistere. L'aria ha un peso che Rinaldo sente sui polmoni prima ancora di respirarla — densa, sbagliata, carica di qualcosa che non ha un nome ma che il corpo riconosce comunque come minaccia. Non serve che nessuno glielo dica: sta per succedere qualcosa, qui, ora.`, en: `The campanellino begins trembling against his side before he even crests the ridge — not the mild oscillation of these last days, something closer to a frantic pulse, as if it knew something he doesn't yet.

The clearing that opens beyond the ridge doesn't resemble anywhere he's crossed so far. The grass is rotten, flattened into circles that have no reason to exist. The air has a weight Rinaldo feels in his lungs before he even breathes it in — dense, wrong, charged with something that has no name but that his body recognizes as threat all the same. No one needs to tell him: something is about to happen, here, now.` } },
      { img: 'assets/storia/scena19/panel-03.jpg', text: { it: `Il calore lo raggiunge un istante dopo, familiare in mezzo a tutto quel resto che non lo è. Beatrice esce dal campanellino come è uscita cento volte prima — la stessa forma translucida, la stessa luce calda che sembra fiamma senza vento — e gli si mette accanto, vicina come non è mai stata, come se anche lei sentisse il bisogno di stare più vicino possibile in un posto così.

Si gira verso di lui.`, en: `The warmth reaches him a moment later, familiar in the middle of everything else that isn't. Beatrice emerges from the campanellino as she has a hundred times before — the same translucent form, the same warm light that looks like flame without wind — and settles close beside him, closer than she has ever been, as if she too felt the need to stay as near as possible in a place like this.

She turns to face him.` } },
      { img: 'assets/storia/scena19/panel-04.jpg', text: { it: `Alza una mano e gli sfiora il viso — un gesto che ha fatto altre volte, in altre forme, in un'altra vita: le dita che gli scostano una ciocca di capelli dalla fronte, lo stesso gesto meccanico e tenero di sempre. Per un solo istante, tutto è esattamente come dovrebbe essere.`, en: `She raises a hand and brushes his face — a gesture she's made before, in other forms, in another life: fingers moving a lock of hair from his forehead, the same tender, habitual motion as always. For one single instant, everything is exactly as it should be.` } },
      { img: 'assets/storia/scena19/panel-05.jpg', text: { it: `Poi, senza smettere di toccarlo, comincia ad allontanarsi.

Non cammina. La sua forma si allunga, come se qualcosa dietro di lei — nella nebbia più fitta, oltre la radura — la stesse tirando a sé, lentamente, senza fretta, con la certezza di chi sa di non avere bisogno di affrettarsi. Le dita restano un istante di più sulla sua guancia, poi si staccano, e la distanza tra loro comincia a crescere.

Lei non smette di guardarlo. Nemmeno per un secondo — nemmeno mentre la nebbia la inghiotte centimetro per centimetro, nemmeno mentre comincia a cambiare.`, en: `Then, without ceasing to touch him, she begins to draw away.

She doesn't walk. Her form stretches, as though something behind her — deeper in the fog, beyond the clearing — were pulling her back, slowly, unhurried, with the certainty of something that knows it has no need to rush. Her fingers linger one instant longer on his cheek, then lift away, and the distance between them starts to grow.

She never stops looking at him. Not for a single second — not as the fog swallows her inch by inch, not even as she begins to change.` } },
      { img: 'assets/storia/scena19/panel-06.jpg', text: { it: `È un cambiamento che Rinaldo vorrebbe non vedere e non riesce a smettere di guardare. La luce calda che l'ha sempre composta si spegne dai bordi verso il centro, come brace che perde colore. La forma si piega in punti che un corpo non dovrebbe piegare — le spalle che si incurvano in avanti, le braccia che si allungano oltre ogni proporzione, la testa che si china sotto un cappuccio che un istante prima non esisteva e adesso è semplicemente lì, come se fosse sempre stato parte di lei. Il suono che ne esce non è un grido e non è un lamento — è qualcosa di più basso, di più vecchio, un rumore che il petto di Rinaldo sente più di quanto lo sentano le orecchie.

I suoi occhi — quelli che un istante prima portavano ancora qualcosa di umano — sono le ultime cose a cambiare, e restano fissi su di lui fino all'ultimo istante prima di sparire sotto il buio del cappuccio.`, en: `It's a change Rinaldo wishes he didn't have to see, and can't stop watching. The warm light that has always composed her dims from the edges inward, like an ember losing its color. Her shape bends at points a body shouldn't bend — shoulders curving forward, arms lengthening past any proportion, her head bowing beneath a hood that didn't exist an instant ago and is now simply there, as if it had always been part of her. The sound that comes out of her is neither a scream nor a moan — it's something lower, older, a noise Rinaldo's chest feels more than his ears hear.

Her eyes — the ones that, an instant before, still carried something human — are the last things to change, and they stay fixed on him until the very last moment before they vanish beneath the hood's darkness.` } },
      { img: 'assets/storia/scena19/panel-07.jpg', text: { it: `Poi non c'è più nessuna Beatrice davanti a lui. C'è solo questo essere, fermo dall'altra parte della radura: la schiena curva sotto il peso di un cappuccio troppo grande per qualunque testa, le braccia troppo lunghe che pendono lungo i fianchi, le dita che finiscono in qualcosa che non sono più unghie. Immobile nello stesso modo innaturale di sempre — e stavolta non ha nessun posto dove ritirarsi.

Poi Rinaldo vede il viso.

È il suo. È quello di Beatrice — la stessa curva degli zigomi, la stessa piega delle labbra che ha baciato mille volte, resa grottesca da una pelle troppo pallida, troppo tesa sull'osso, come se qualcosa sotto stesse spingendo per uscire. La sua amata è lì, davanti a lui, in una sembianza orrifica. È la Borda.

Ma come può essere?

Rinaldo non riesce a fare niente per un istante che dura troppo a lungo — non muoversi, non parlare, non respirare nel modo giusto. Poi la Borda si muove verso di lui, e il momento per capire finisce prima ancora di cominciare davvero.`, en: `Then there is no Beatrice in front of him anymore. There is only this being, standing at the far end of the clearing: its back curved beneath the weight of a hood too large for any head, arms too long hanging along its sides, fingers ending in something that are no longer nails. Still in that same unnatural way as always — except this time it has nowhere to retreat to.

Then Rinaldo sees the face.

It's hers. It's Beatrice's — the same curve of the cheekbones, the same fold of the lips he has kissed a thousand times, made grotesque by skin too pale, stretched too tight over the bone, as if something beneath were pushing to get out. His beloved is there, in front of him, in a horrific semblance. It's the Borda.

But how can that be?

Rinaldo can't do anything for an instant that lasts too long — can't move, can't speak, can't breathe properly. Then the Borda moves toward him, and whatever moment there might have been to understand ends before it ever really begins.` } },
      { img: 'assets/storia/scena19/panel-08.jpg', text: { it: `Non pensa alle mosse. Il corpo, dopo mesi di questo, ha imparato qualcosa che la testa non ha mai imparato del tutto — quando spostare il peso, quando lasciare che il colpo scivoli invece di incassarlo. Non è diventato un guerriero. Non lo sarà mai. Ma ha smesso di essere l'uomo che teneva l'arma come si tiene qualcosa che scotta.

Combatte senza smettere di vedere, sovrapposta a ogni fendente della Borda, la stessa figura translucida di un attimo prima. Ogni colpo che para è anche un colpo che non riesce a credere di dover parare.

*[BO]"Ti ho guidato fin qui io,"* dice la Borda, la voce bassa, ruvida, che porta dentro di sé un timbro che Rinaldo riconosce e vorrebbe non riconoscere. *[BO]"Sai perché? Perché volevo vederti la faccia in questo momento."*`, en: `He doesn't think about the moves. His body, after months of this, has learned something his mind never fully has — when to shift his weight, when to let a blow slide instead of taking it head-on. He hasn't become a warrior. He never will. But he's stopped being the man who held a weapon like something that burns.

He fights without ever ceasing to see, superimposed over every strike of the Borda, that same translucent figure from a moment before. Every blow he parries is also a blow he can't believe he has to parry.

*[BO]"I led you here myself,"* says the Borda, her voice low, rough, carrying a timbre Rinaldo recognizes and wishes he didn't. *[BO]"Do you know why? Because I wanted to see your face in this moment."*` } },
      { img: 'assets/storia/scena19/panel-09.jpg', text: { it: `Un artiglio gli sfiora il fianco — non abbastanza da fermarlo, abbastanza da ricordargli, con un dolore netto e freddo, che questa cosa può ancora ucciderlo. Rinaldo lo lascia essere solo dolore. Non lo lascia diventare paura, non ancora.

*[BO]"Ancora con quel campanellino stretto in mano,"* dice lei, quando lui arretra di un passo, la mano che cerca istintivamente il peso alla cintura. *[BO]"Ti fa sentire meno solo?"*

*[R]"Zitta,"* dice Rinaldo, e non è quello che vorrebbe dire — è tutto quello che riesce a dire.`, en: `A claw grazes his side — not enough to stop him, enough to remind him, with a clean, cold pain, that this thing can still kill him. Rinaldo lets it be only pain. He doesn't let it become fear, not yet.

*[BO]"Still holding that little bell,"* she says, as he steps back, his hand instinctively reaching for its weight at his belt. *[BO]"Does it make you feel less alone?"*

*[R]"Shut up,"* says Rinaldo, and it isn't what he wants to say — it's all he can manage to say.` } },
      { img: 'assets/storia/scena19/panel-10.jpg', text: { it: `*[BO]"Non vuoi usare il campanellino contro di me?"* Ride — una risata sbagliata, troppo profonda per una voce che dovrebbe essere umana, che si spezza a metà come se qualcosa nella gola non riuscisse più a sostenerla fino in fondo. Il campanellino resta muto contro il suo fianco, come sempre in sua presenza — nessun calore, nessun aiuto, solo un peso freddo che non fa niente.

*[BO]"Il decotto era buono, quella notte,"* dice lei, più piano, quasi con dolcezza, mentre lo spinge indietro con un colpo che lui riesce a deviare per un pelo. *[BO]"Non hanno sofferto."*

Non è un'accusa. Non è nemmeno detto come un fatto che le costi qualcosa. È detto piano, quasi con indifferenza — ed è proprio questo, più di ogni artiglio, a fargli mancare per un istante l'aria.

Rinaldo non risponde più. Non ha più parole da spendere — solo il corpo, che continua a muoversi, a parare, a cercare l'apertura che sa di dover trovare prima che uno dei due smetta di reggersi in piedi.`, en: `*[BO]"Don't you want to use the little bell against me?"* She laughs — a wrong laugh, too deep for a voice that should be human, breaking halfway through as if something in her throat could no longer sustain it. The campanellino stays silent against his side, as always in her presence — no warmth, no help, only a cold weight doing nothing at all.

*[BO]"The brew was good, that night,"* she says, more quietly, almost tenderly, as she pushes him back with a blow he barely manages to deflect. *[BO]"They didn't suffer."*

It isn't an accusation. It isn't even said like a fact that costs her anything. It's said quietly, almost with indifference — and it's exactly that, more than any claw, that steals his breath for an instant.

Rinaldo doesn't answer anymore. He has no more words to spend — only his body, still moving, still parrying, still searching for the opening he knows he has to find before one of them stops being able to stand.` } },
      { img: 'assets/storia/scena19/panel-11.jpg', text: { it: `Arriva il momento in cui il corpo, più veloce della mente, riconosce un'apertura vera — non un varco fortunato, uno vero, il tipo che si presenta una volta sola. Rinaldo non decide di colpire. Il colpo parte prima che decida, con tutta la forza che gli resta, diretto a finire quello che ha davanti — perché è ancora una minaccia, perché sta ancora cercando di ucciderlo, e perché una parte di lui, quella che non riesce ancora ad accettare quello che ha visto sul crinale, ha disperatamente bisogno che finisca.

Il fendente arriva.`, en: `The moment comes when his body, faster than his mind, recognizes a real opening — not a lucky gap, a real one, the kind that comes only once. Rinaldo doesn't decide to strike. The blow starts before he decides, with all the strength he has left, meant to finish what's in front of him — because it's still a threat, because it's still trying to kill him, and because some part of him, the part that still can't accept what he saw on the ridge, desperately needs it to be over.

The blow lands.` } },
      { img: 'assets/storia/scena19/panel-12.jpg', text: { it: `E nello stesso istante, il campanellino esplode.

Non un calore come tutti gli altri — un'esplosione vera, un lampo bianco che gli brucia la vista prima ancora che il suono lo raggiunga, come se tutto quel calore accumulato in mesi di Momenti di Connessione, mai speso del tutto, avesse trovato in questo istante preciso l'unico varco abbastanza grande per uscire tutto insieme. Rinaldo viene scaraventato all'indietro, l'arma che gli sfugge di mano, il mondo che per un tempo che non sa misurare si riduce a un bianco assoluto e a un ronzio che gli riempie le orecchie al posto di ogni altro suono.`, en: `And in that same instant, the campanellino explodes.

Not a warmth like all the others — a true explosion, a white flash that burns his sight before the sound even reaches him, as if all that warmth built up over months of Moments of Connection, never fully spent, had found in this exact instant the only opening wide enough to escape all at once. Rinaldo is thrown backward, the weapon slipping from his hand, the world reduced, for a stretch of time he can't measure, to an absolute white and a ringing that fills his ears in place of every other sound.` } },
      { img: 'assets/storia/scena19/panel-13.jpg', text: { it: `Quando la vista gli torna, non trova la radura.

C'è un bianco che non ha misura — non nebbia, non luce di giorno, niente che il corpo riconosca come un luogo vero. È uniforme, immobile, senza un'ombra a segnare dove finisce una cosa e comincia un'altra. Il fango sotto i piedi, l'aria marcia della radura, il peso dell'artiglio sul fianco — tutto è rimasto da qualche parte che non è più qui.`, en: `When his sight returns, he doesn't find the clearing.

There is a white without measure — not fog, not daylight, nothing his body recognizes as a real place. It's uniform, motionless, without a single shadow to mark where one thing ends and another begins. The mud underfoot, the rotten air of the clearing, the weight of the claw at his side — all of it has stayed somewhere that isn't here anymore.` } },
      { img: 'assets/storia/scena19/panel-14.jpg', text: { it: `E a terra, davanti a lui, c'è Beatrice.

Non la forma translucida di sempre. Non la luce calda e senza peso uscita cento volte dal campanellino. È lei — la pelle, i capelli, la ciocca bianca sopra la tempia sinistra la stessa di sempre — un corpo intero e pesante come un corpo vero, riverso su un terreno che non esiste da nessuna parte fuori da questo bianco.

Rinaldo non decide di correre. Le gambe si muovono prima che il pensiero le raggiunga.

*[R]"Beatrice."*

Il nome gli esce a pezzi, come se il petto non riuscisse a tenerlo tutto insieme in una sola volta. Cade in ginocchio accanto a lei, le braccia già intorno a quel corpo che pesa esattamente come dovrebbe pesare un corpo vero — non ricordava più quanto potesse pesare, quanto potesse essere caldo.`, en: `And on the ground, in front of him, is Beatrice.

Not her usual translucent form. Not the warm, weightless light that has stepped out of the campanellino a hundred times. It's her — the skin, the hair, the white streak above her left temple the same as always — a whole body, heavy like a real body, lying on ground that exists nowhere outside this white.

Rinaldo doesn't decide to run. His legs move before the thought reaches them.

*[R]"Beatrice."*

The name comes out of him in pieces, as if his chest couldn't hold it all together at once. He drops to his knees beside her, arms already around a body that weighs exactly as a real body should weigh — he'd forgotten how much weight it could have, how warm it could be.` } },
      { img: 'assets/storia/scena19/panel-15.jpg', text: { it: `Lei apre gli occhi.

Non subito, non tutti insieme — le palpebre che si muovono come chi risale da un sonno più profondo di ogni altro sonno. Poi lo vedono, e qualcosa in loro si riconosce, si aggrappa.

Lo stringe. Con tutta la forza che ha, che è poca ed è tutto quello che ha. Alza le braccia — lentamente, come chi non usa un corpo da troppo tempo per ricordarsi bene come si fa — e le richiude intorno a lui.

Nessuno dei due dice niente per un tempo che non si misura. Poi Rinaldo, senza smettere di tenerla, sente il proprio viso bagnato, e non sa dire quando ha cominciato — solo che non riesce a fermarlo, e non vuole.

La bacia. Lei ricambia, e per un istante — solo un istante, prima che tutto il resto torni a esistere intorno a loro — non c'è nessuna radura, nessun cappuccio, nessuna nebbia. C'è solo questo.

Si staccano quanto basta perché lei possa guardarlo in viso.

*"Amore mio,"* dice, la voce sua fino all'ultima sfumatura, come non lo è mai stata in tutti questi mesi. *"Allora sei qui. Vicino a me."*

*[R]"Sono qui,"* dice lui, e non riesce a dire altro — ogni altra parola sembra troppo piccola per il momento in cui la sta dicendo.

*"Ti ho sentito,"* dice lei, una mano che gli sfiora il viso — lo stesso gesto di sempre, ma adesso con dita che hanno un peso vero. *"Per tutto questo tempo. Non sapevo di poterlo fare. Non sapevo nemmeno di essere ancora qualcosa capace di sentire. Ma ti ho sentito. Ogni volta."*`, en: `She opens her eyes.

Not right away, not all at once — her eyelids moving like someone surfacing from a sleep deeper than any other sleep. Then they find him, and something in them recognizes him, holds on.

She holds him. With all the strength she has, which is little and is everything she has. She raises her arms — slowly, like someone who hasn't used a body in too long to quite remember how — and closes them around him.

Neither of them says anything for a stretch of time that can't be measured. Then Rinaldo, without letting go of her, feels his own face wet, and can't say when it started — only that he can't stop it, and doesn't want to.

He kisses her. She kisses him back, and for an instant — just one instant, before everything else returns to exist around them — there is no clearing, no hood, no fog. There is only this.

They part just enough for her to look at his face.

*"My love,"* she says, her voice hers down to the last shade of it, in a way it hasn't been in all these months. *"So you're here. Close to me."*

*[R]"I'm here,"* he says, and can't manage anything more — every other word feels too small for the moment he's saying it in.

*"I felt you,"* she says, a hand brushing his face — the same gesture as always, but now with fingers that have real weight. *"This whole time. I didn't know I could do that. I didn't even know I was still something capable of feeling. But I felt you. Every time."*` } },
      { img: 'assets/storia/scena19/panel-16.jpg', text: { it: `Rinaldo le tiene il viso tra le mani, come se dovesse verificarlo una seconda volta, e una terza — e continuerebbe a farlo all'infinito, se qualcosa non gli chiedesse, in questo momento, di guardare altrove.

Un movimento, ai margini di quel bianco senza margini.

Rinaldo si volta.

Non è vicina, e non è nemmeno lontana nel modo in cui lo era nella radura — le distanze, qui, non si misurano come altrove. È semplicemente lì: la stessa sagoma incappucciata di sempre, ferma, che li guarda.
