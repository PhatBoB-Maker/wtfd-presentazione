Non si avvicina. Non parla. C'è, nel modo in cui resta immobile, qualcosa che non somiglia a una scelta — come se qualcosa la tenesse ferma contro la sua stessa volontà, un guinzaglio che nessuno dei due vede ma che lei, evidentemente, sente. Assiste. Non può fare altro.`, en: `Rinaldo holds her face in his hands, as if he needed to check a second time, and a third — and he would keep doing it forever, if something didn't ask him, right now, to look elsewhere.

A movement, at the edge of that edgeless white.

Rinaldo turns.

She isn't close, and isn't even far the way she was in the clearing — distances here don't measure the way they do elsewhere. She's simply there: the same hooded shape as always, still, watching them.

She doesn't come closer. She doesn't speak. There's something in the way she stays motionless that doesn't resemble a choice — as though something were holding her still against her own will, a leash neither of them can see but that she, clearly, feels. She watches. She can do nothing else.` } },
      { img: 'assets/storia/scena19/panel-17.jpg', text: { it: `*[R]"Cosa vuoi da noi,"* dice Rinaldo, la voce che trema più di rabbia che di paura, gli occhi fissi su quella sagoma ferma nel bianco. *[R]"Cosa vuoi da lei? Allontanati da noi!"*

*[BO]"Ma io sono lei,"* dice la Borda, e non c'è scherno nella voce, questa volta — solo qualcosa che assomiglia alla stanchezza. *[BO]"Lei è me. Non hai ancora capito?"*

*[R]"Cosa farnetichi,"* dice Rinaldo, un passo indietro senza accorgersene, come se il corpo rifiutasse quello che le orecchie hanno appena sentito. *[R]"Cosa dici."*

Non le crede. Non può crederle — non ancora, non da quella bocca, non pronunciato da quella cosa. Si volta verso Beatrice, cercando nei suoi occhi qualcosa che smentisca.

*[R]"Beatrice."*

Il nome gli esce come una domanda, non come un richiamo.

Beatrice annuisce, piano. *"Ora ricordo tutto,"* dice.

*[R]"Perché tu,"* dice Rinaldo, la voce già rotta a metà — non più rivolto a lei, adesso, ma a quella sagoma ferma nel bianco che non si avvicina. *[R]"Perché proprio lei."*

Per un momento, niente risponde. Poi la voce della Borda arriva — piatta, priva della crudeltà portata per tutto il combattimento, quasi un resoconto più che uno scherno.`, en: `*[R]"What do you want from us,"* says Rinaldo, his voice shaking more from anger than fear, eyes fixed on that motionless shape in the white. *[R]"What do you want from her? Get away from us!"*

*[BO]"But I am her,"* says the Borda, and there's no mockery in her voice this time — only something that resembles exhaustion. *[BO]"She is me. Haven't you understood yet?"*

*[R]"What are you raving about,"* says Rinaldo, a step back without noticing, as if his body refused what his ears just heard. *[R]"What are you saying."*

He doesn't believe her. He can't believe her — not yet, not from that mouth, not spoken by that thing. He turns to Beatrice, searching her eyes for something that denies it.

*[R]"Beatrice."*

The name comes out of him as a question, not a summons.

Beatrice nods, quietly. *"I remember everything now,"* she says.

*[R]"Why you,"* says Rinaldo, his voice already breaking halfway through — not to her now, but turned toward that motionless shape in the white that won't come closer. *[R]"Why her, of all of them."*

For a moment, nothing answers. Then the Borda's voice arrives — flat, stripped of the cruelty she carried through the whole fight, closer to a plain account than a taunt.` } },
      { img: 'assets/storia/scena19/panel-18.jpg', text: { it: `*[BO]"L'ho sentita,"* dice. *[BO]"Da lontano, prima ancora di scegliere. Non tutte le madri amano allo stesso modo, Rinaldo. La maggior parte ama abbastanza da soffrire, quando arriva il momento. Lei amava abbastanza da diventare qualcosa di più — se solo l'avessi spinta al punto giusto."* Una pausa, come se pronunciarlo le costasse qualcosa che non si aspettava di provare. *[BO]"Più grande è l'amore che una madre porta ai figli che poi perde per mano propria, più forte divento, quando la scelgo. Nessuna, prima di lei, aveva amato così tanto. Per questo ho forzato la porta, invece di aspettare il mio turno."* La voce si fa più dura, quasi compiaciuta di se stessa. *[BO]"Sono stata io. Ho fatto in modo che tu uccidessi i tuoi figli, quella notte."* Rivolta a Beatrice, adesso, non più a lui. *[BO]"Non un incidente che ti è capitato. Un dono che mi sono fatta — anche se allora non lo sapevo ancora."*

Beatrice non risponde subito. Quando lo fa, la voce le trema in un modo che non ha ancora avuto in tutta la conversazione. *"Lo sapevo,"* dice, piano. *"O forse no. Non so nemmeno adesso se l'ho sempre saputo, in qualche parte di me, o se è solo quello che scelgo di credere ora che qualcuno l'ha detto ad alta voce."*

*"Quello che so per certo,"* continua, *"è cosa è successo dopo. Sono morta credendo che tu — che la Borda — li avesse presi vivi. È morta con quella speranza, quella notte al rogo. E in quell'istante, qualcosa si è strappato."*

*[BO]"Un ciclo normale non lascia niente indietro,"* dice la Borda, la voce che si spezza su ogni parola come qualcosa che non è più abituato a formarle con cura. *[BO]"Prende tutto — la persona intera, senza eccezioni. Chi è venuta prima di me è passata così: la madre dell'eremita, anni fa. La donna del Sacello, prima ancora. Ogni volta il ciclo si è chiuso pulito, senza lasciare indietro nemmeno un frammento di chi erano state. Io no. Con lei è stato diverso — perché non ho aspettato il mio turno, come ho sempre fatto prima. L'ho presa in anticipo. E prendere qualcosa prima che sia pronto a essere preso, a volte, significa non prenderlo tutto."*

*"E quello che è rimasto fuori,"* dice Beatrice, *"è arrivato nel campanellino nello stesso istante in cui io — in cui lei —"* si ferma, e per un momento nessuna delle due voci trova le parole giuste per finire quella frase, come se anche loro, adesso, faticassero a capire dove finisca una e cominci l'altra. *"Nell'istante in cui sono morta davvero. Non prima. La forzatura di gennaio ha aperto la porta. Ma io — l'amore che avevo per te, per i bambini, tutto quello che non apparteneva alla colpa — mi sono staccata solo quando il fuoco ha finito quello che la nebbia aveva cominciato."*

*[R]"E per questo,"* dice Rinaldo, e la voce gli esce quasi senza volerlo, come se il pensiero fosse arrivato prima di lui, *[R]"per questo hai potuto aiutarmi. Per tutto questo tempo."*

*"Sì."* Beatrice fa un passo verso di lui, le gambe che sembrano ancora imparare a reggerla dopo tutto questo tempo. *"Non perché qualcuno me lo abbia permesso. Perché l'amore che provavo per te era l'unica parte di me che quella notte non ha potuto reclamare. Ti ho guidato non per salvarti — non lo sapevo nemmeno io, cosa stavo facendo, all'inizio. Ti ho guidato perché era l'unica cosa che sapevo ancora fare, l'unica direzione che mi restava."*

*[BO]"E io,"* dice la Borda, la testa che si volta appena verso di lui per la prima volta da quando ha ripreso a parlare, *[BO]"ho continuato a fare quello che sono diventata. Senza saperlo. Senza ricordare che esistesse un'altra parte di me da qualche parte, ad aiutarti a trovarmi."*

Rinaldo guarda l'una, poi l'altra, e sente qualcosa cedere dentro di sé che non tornerà mai più al suo posto. Non c'è una vittima e un mostro, seduti l'una accanto all'altra per caso. C'è solo sua moglie, spezzata in due dal modo in cui è morta — e per la prima volta, invece di dover scegliere di crederci, può vederlo con i propri occhi: sono la stessa persona, anche restando due forme separate davanti a lui.`, en: `*[BO]"I felt her,"* she says. *[BO]"From far away, before I ever chose. Not every mother loves the same way, Rinaldo. Most love enough to suffer, when the moment comes. She loved enough to become something more — if only I pushed her to the right point."* A pause, as if saying it cost her something she hadn't expected to feel. *[BO]"The greater the love a mother carries for the children she then loses by her own hand, the stronger I become when I choose her. No one, before her, had loved so much. That's why I forced the door open, instead of waiting my turn."* Her voice hardens, almost pleased with itself. *[BO]"It was me. I made sure you killed your own children, that night."* Turned to Beatrice now, not to him. *[BO]"Not an accident that happened to you. A gift I gave myself — even if I didn't know it yet, back then."*

Beatrice doesn't answer right away. When she does, her voice trembles in a way it hasn't through the whole conversation. *"I knew,"* she says, quietly. *"Or maybe I didn't. I don't even know now if I always knew it, somewhere in me, or if it's only what I choose to believe now that someone's said it out loud."*

*"What I know for certain,"* she goes on, *"is what happened after. I died believing that you — that the Borda — had taken them alive. I died with that hope, that night at the stake. And in that instant, something tore."*

*[BO]"A normal cycle leaves nothing behind,"* says the Borda, her voice breaking on every word like something no longer used to shaping them with care. *[BO]"It takes everything. Whoever came before me — the hermit's mother, the woman from the Sacello — they left nothing else behind. I did. Because I didn't wait my turn. I took it early."*

*"And what was left outside,"* says Beatrice, *"arrived in the campanellino in the same instant that I — that she —"* she stops, and for a moment neither voice can find the right words to finish the sentence, as if even they, now, struggle to know where one ends and the other begins. *"In the instant I truly died. Not before. January's forcing opened the door. But I — the love I had for you, for our children, everything that didn't belong to the guilt — only broke away when the fire finished what the fog had started."*

*[R]"And that's why,"* says Rinaldo, and the words come out almost without his willing them, as if the thought had arrived before he did, *[R]"that's why you could help me. This whole time."*

*"Yes."* Beatrice takes a step toward him, her legs still seeming to learn how to hold her after all this time. *"Not because anyone allowed it. Because the love I felt for you was the one part of me that night couldn't claim. I didn't guide you to save you — I didn't even know, at first, what I was doing. I guided you because it was the only thing I still knew how to do, the only direction left to me."*

*[BO]"And I,"* says the Borda, her head turning slightly toward him for the first time since she began speaking again, *[BO]"went on doing what I'd become. Without knowing. Without remembering that another part of me existed somewhere, helping you find me."*

Rinaldo looks from one to the other, and feels something give way inside him that will never sit right again. There is no victim and no monster, sitting side by side by chance. There is only his wife, split in two by the way she died — and for the first time, instead of having to choose to believe it, he can see it with his own eyes: they are the same person, even while remaining two separate shapes before him.` } },
      { img: 'assets/storia/scena19/panel-19.jpg', text: { it: `*"Guarda,"* dice Beatrice, e non è più rivolta a lui — è rivolta a un punto oltre le sue spalle, dove il bianco comincia ad ammorbidirsi, quasi a prendere consistenza.

Ci sono. Non dove ci si aspetterebbe di vedere due bambini dopo mesi di assenza — non vicini, non solidi, non con niente della fisicità che Rinaldo ricorda. Sono lì, in quel bianco, a una distanza che non si misura in passi, con la stessa qualità sospesa che ha visto nella corda al camposanto: presenti, ma non del tutto. Come figure guardate attraverso un vetro appannato che il fiato continua ad appannare. Si muovono — o qualcosa in loro si muove — e sembrano interi, ma c'è qualcosa che il corpo di Rinaldo riconosce come sbagliato prima che la mente riesca a nominarlo.

Non sono vivi nel modo ordinario. Non sono morti.

*[R]"Da quanto?"* La voce gli esce a fatica.

*"Da quella notte,"* dice Beatrice. *"Il legame li ha tenuti così da allora. Non lo sapevo. Credevo che la Borda li avesse presi vivi, da qualche parte — è la stessa cosa che ho creduto fino al momento in cui sono morta, e la stessa cosa che quella parte di me ha continuato a credere per tutto il tempo in cui ti ho guidato senza saperlo."*`, en: `*"Look,"* says Beatrice, and she's no longer speaking to him — she's looking at a point beyond his shoulders, where the white begins to soften, almost taking on substance.

They're there. Not where one would expect to see two children after months of absence — not close, not solid, with nothing of the physicality Rinaldo remembers. They're there, in that white, at a distance that isn't measured in steps, with the same suspended quality he saw in the cord at the burial ground: present, but not entirely. Like figures seen through fogged glass that breath keeps fogging over again. They move — or something in them moves — and they look whole, but there's something Rinaldo's body recognizes as wrong before his mind can name it.

They aren't alive in the ordinary way. They aren't dead.

*[R]"How long?"* The words come out with effort.

*"Since that night,"* says Beatrice. *"The bond has kept them like this ever since. I didn't know. I believed the Borda had taken them somewhere, alive — it's the same thing I believed until the moment I died, and the same thing that part of me went on believing the whole time I was guiding you without knowing it."*` } },
      { img: 'assets/storia/scena19/panel-19b.jpg', text: { it: `*"Adesso puoi scegliere,"* dice Beatrice, e la Borda, ferma nel bianco più in là, non la contraddice.

*"Se mi uccidi,"* continua, *"il legame che li tiene qui si spezza con me. Non li libera, Rinaldo. Li finisce. Quello che sono adesso, in quella nebbia, smette di essere anche quello. Non tornano da nessuna parte. Semplicemente, non ci sono più."*

*[R]"E se non lo faccio?"*

*[BO]"Se mi risparmi,"* dice la Borda — e per la prima volta da quando ha ripreso a parlare, qualcosa cambia: non il tono, la sostanza. Sotto il ringhio che la accompagna da sempre, per un istante, c'è la voce di Beatrice, intera, riconoscibile in ogni sfumatura, come se fosse rimasta lì per tutto questo tempo sotto uno strato che solo ora si assottiglia abbastanza da lasciarla passare. Il viso resta lo stesso — la pelle troppo tesa, gli occhi sbagliati, le dita che finiscono in artigli — ma per un istante, sentendola parlare così, Rinaldo fatica a guardare quella bocca deforme e non vedere quella di sua moglie. *[BO]"Te li do indietro. La corda cade. Loro tornano — vivi, interi, senza ricordo di niente di tutto questo. Potrai riaverli tra le tue braccia, Rinaldo. I loro sorrisi. I loro abbracci. Li vedrai crescere, diventare quello che diventeranno."*`, en: `*"Now you can choose,"* says Beatrice, and the Borda, standing in the white further off, doesn't contradict her.

*"If you kill me,"* she goes on, *"the bond keeping them here breaks with me. It doesn't free them, Rinaldo. It ends them. Whatever they are now, in that fog, stops being even that. They don't go anywhere. They simply aren't, anymore."*

*[R]"And if I don't?"*

*[BO]"If you spare me,"* says the Borda — and for the first time since she began speaking again, something changes: not the tone, the substance. Beneath the growl that has followed her all along, for an instant, there is Beatrice's voice, whole, recognizable in every nuance, as if it had stayed there the whole time under a layer only now thin enough to let it through. The face stays the same — the skin stretched too tight, the eyes wrong, fingers ending in claws — but for an instant, hearing her speak like this, Rinaldo struggles to look at that misshapen mouth and not see his wife's. *[BO]"I'll give them back to you. The cord falls. They return — alive, whole, with no memory of any of this. You could hold them in your arms again, Rinaldo. Their smiles. Their embraces. You'll watch them grow, become whatever they'll become."*` } },
      { img: 'assets/storia/scena19/panel-19c.jpg', text: { it: `Le dita si muovono verso di lui — un gesto che comincia come una carezza dimenticata, prima di fermarsi a mezz'aria, come se qualcosa, all'ultimo istante, le impedisse di finirlo. *[BO]"E saranno al sicuro da me. Questo te lo prometto: non toccherò mai più un capello dei nostri figli. Né il tuo."*

*[BO]"Ma non sparirò del tutto, nemmeno io,"* continua, la voce che si fa più bassa, più simile a un segreto condiviso che a una minaccia. *[BO]"Fra una notte e l'altra — fra una madre e l'altra a cui prenderò quello che devo prendere, perché quello non smetterà, qualunque cosa tu scelga adesso — verrò a trovarvi. Nella nebbia, ai margini del campo, dove nessun altro guarderà mai. E resterò abbastanza vicina perché tu possa ancora chiamarmi come mi chiamavi. Nessun altro, in nessun luogo di questo mondo, dirà mai più il mio nome e lo intenderà per davvero. Solo tu, Rinaldo. Solo per te sarò ancora Beatrice, quando lo vorrai."*`, en: `Her fingers move toward him — a gesture that begins like a forgotten caress, before stopping mid-air, as if something, at the last instant, keeps her from finishing it. *[BO]"And they'll be safe from me. This I promise you: I will never touch a hair on our children's heads again. Nor yours."*

*[BO]"But I won't disappear completely either,"* she goes on, her voice dropping lower, closer to a shared secret than a threat. *[BO]"Between one night and the next — between one mother and the next from whom I'll take what I must take, because that won't stop, whatever you choose now — I'll come to see you both. In the fog, at the edge of the field, where no one else will ever look. And I'll stay close enough that you can still call me what you used to call me. No one else, anywhere in this world, will ever say my name again and mean it. Only you, Rinaldo. Only for you will I still be Beatrice, whenever you want."*` } },
      { img: 'assets/storia/scena19/panel-19d.jpg', text: { it: `Rinaldo si scosta, d'istinto — un passo indietro, non deciso, solo il corpo che rifiuta quello che gli hanno appena offerto. E per un solo istante, negli occhi di lui, la Borda vede quello che è diventata: riflessa, piccola, capovolta, nello sguardo dell'unico che l'ha amata per intero. Qualcosa, in quel riflesso, le fa male in un modo che il resto della scena non le ha fatto — un dolore vero, non recitato. Il viso le si contrae in una smorfia che non è più solo rabbia — e quando si ricompone, non c'è più traccia della voce di prima.

*[BO]"E resto,"* dice, la voce che torna piatta, la stessa di sempre. *[BO]"Senza quello che è rimasto nel campanellino. Senza quello che di lei c'era ancora qui, ad ancorarla a te. Solo la Borda."*

Non è una domanda, e nessuno dei due la tratta come tale.

*"Rinaldo,"* dice Beatrice, e in quella parola c'è qualcosa che non ha ancora avuto in tutta la conversazione — un'urgenza, come se il tempo che le resta si stesse assottigliando sotto le sue stesse parole. *"Devo dirti una cosa, e devo dirtela adesso, perché non avrò un'altra occasione."*

*[R]"Dimmi."*

*"Ti conosco. Ti ho conosciuto da prima che tu sapessi chi eri davvero, e ti conosco ancora adesso, in questo. So cosa succede se scegli loro."* Una pausa che sembra costarle più di ogni altra parola detta finora. *"Se mi risparmi, io continuo — la stessa cosa, sempre, come da tradizione. Altri padri soffriranno quello che soffri tu, adesso. Altre madri piangeranno figli che non ritroveranno mai. Altri bambini smetteranno di esistere in qualche nebbia che nessuno saprà mai dove cercare. Senza sosta. Come è sempre stato, prima di me, e come sarà dopo di me."* La voce le trema, ma non si ferma. *"E ogni volta che sentirai di un bambino sparito, ogni volta che arriverà voce di un altro villaggio nella nebbia, ogni volta che una madre perderà un figlio in un modo che nessuno riesce a spiegare — saprai. Non come una colpa astratta. Come una cosa concreta. Come se l'avessi fatto tu con le tue stesse mani, perché sarai stato tu a lasciarmi in vita per farlo."*

*[R]"Basta."*

*"Non posso smettere. Non ho altro tempo, ed è l'unica cosa che conta davvero."* *"Non ti sto chiedendo di uccidere i nostri figli. Quella notte è già successa — non posso disfarla, tu non puoi disfarla, nessuno può. Ti sto chiedendo che non succeda mai più a nessun altro. Ci sono altre madri, Rinaldo. Ci sono altri bambini che ogni sera aspettano il rumore di passi che tornano a casa."* Si ferma un istante, come se dovesse convincersene lei stessa prima di poterlo dire ad alta voce. *"So che fermandomi, tutto questo finisce con me. Deve finire con me. È l'unica cosa a cui posso aggrapparmi in questo momento, ed è più di quanto avessi ieri."* *"Ogni bambino che sparirà da qui in avanti, se mi risparmi, sarà un bambino che avresti potuto salvare fermandomi adesso, con le tue stesse mani. Lo saprai. Ogni volta."* Le mani le tremano, come qualcosa che sta per perdere la presa su una forma appena ritrovata. *"So meglio di chiunque altro cosa ti sto chiedendo di sacrificare. E te lo chiedo lo stesso. Fermami, Rinaldo. Fermaci. Non lasciare che l'amore ti offuschi la mente. Ferma questa follia. Non mi condannare a questo."*

*[BO]"Ah, davvero?"* La voce della Borda arriva da dove è rimasta ferma, e non ha più niente della piattezza di poco prima — è di nuovo lei, di nuovo crudele, di nuovo viva del gusto di infierire. *[BO]"Guardali bene. Potrebbero essere di nuovo tra le tue braccia tra pochissimo. Vuoi davvero che smettano di esistere? È l'unica cosa che ti resta di me, Rinaldo. Lasciami vivere, e rivedrai la mia luce negli occhi di Isabella. I miei capelli corvini in quelli di Ludovico. Da' un senso a questo viaggio — se mi risparmi, tutto quello che hai amato in me resterà vivo, in loro, ogni giorno per il resto della tua vita."*

*[BO]"E pensaci bene,"* continua, la voce che si stringe attorno a lui come una mano. *[BO]"Vuoi davvero passare il resto dei tuoi giorni sapendo che potevi salvarli, e hai scelto di non farlo? Che la possibilità era lì, nelle tue mani, e tu l'hai buttata via? A nessun altro sarà mai data questa scelta, Rinaldo. Solo a te. E se la rifiuti, lo saprai per sempre — non un dubbio che sfuma col tempo. Una certezza che ti porterai a letto ogni notte, per il resto della tua vita."*

Nel bianco, i suoi figli aspettano. Non chiamano. Non si muovono verso di lui. Aspettano nel modo in cui aspettano le cose che non hanno ancora deciso se sono vive o no.`, en: `Rinaldo pulls back, on instinct — a step backward, not decided, just his body refusing what has just been offered to him. And for one single instant, in his eyes, the Borda sees what she has become: reflected, small, inverted, in the gaze of the only one who ever loved her completely. Something in that reflection hurts her in a way the rest of the scene hasn't — real pain, not performed. Her face contracts into a grimace that is no longer only rage — and when it settles again, there is no trace left of the voice from before.

*[BO]"And I remain,"* she says, her voice turning flat again, the same as always. *[BO]"Without what's left in the campanellino. Without whatever of her was still here, anchoring her to you. Only the Borda."*

It isn't a question, and neither of them treats it as one.

*"Rinaldo,"* says Beatrice, and there's something in that word that hasn't been there through the whole conversation — an urgency, as if what time she has left were thinning beneath her own words. *"I have to tell you something, and I have to tell you now, because I won't have another chance."*

*[R]"Tell me."*

*"I know you. I knew you before you knew who you really were, and I know you still, even in this. I know what happens if you choose them."* A pause that seems to cost her more than every other word said so far. *"If you spare me, I go on — the same thing, always, as tradition demands. Other fathers will suffer what you're suffering now. Other mothers will weep for children they'll never find again. Other children will stop existing in some fog no one will ever know where to search. Without pause. As it has always been, before me, and as it will be after me."* Her voice shakes, but doesn't stop. *"And every time you hear of a missing child, every time word arrives from another village in the fog, every time a mother loses a son or daughter in a way no one can explain — you'll know. Not as some abstract guilt. As something concrete. As if you'd done it yourself, with your own hands, because it will have been you who let me live to do it."*

*[R]"Stop."*

*"I can't stop. I don't have any more time, and this is the only thing that truly matters."* *"I'm not asking you to kill our children. That night already happened — I can't undo it, you can't undo it, no one can. I'm asking that it never happens to anyone else again. There are other mothers, Rinaldo. There are other children who wait every evening for the sound of footsteps coming home."* She pauses for a moment, as if she needed to convince herself before she could say it aloud. *"I know that by stopping me, all of this ends with me. It has to end with me. It's the only thing I can hold onto right now, and it's more than I had yesterday."* *"Every child who disappears from now on, if you spare me, will be a child you could have saved by stopping me now, with your own hands. You'll know it. Every time."* Her hands tremble, like something about to lose its grip on a shape only just found again. *"I know better than anyone what I'm asking you to sacrifice. And I'm asking it anyway. Stop me, Rinaldo. Stop us. Don't let love cloud your mind. Stop this madness. Don't condemn me to this."*

*[BO]"Oh, really?"* The Borda's voice comes from where she has remained still, and it no longer carries any of the flatness from before — she's herself again, cruel again, alive again with the taste of cruelty. *[BO]"Look at them closely. They could be in your arms again very soon. Do you really want them to stop existing? It's the only thing you have left of me, Rinaldo. Let me live, and you'll see my light again in Isabella's eyes. My raven hair in Ludovico's. Give this whole journey meaning — spare me, and everything you loved in me will stay alive, in them, every day for the rest of your life."*

*[BO]"And think about it,"* she goes on, her voice tightening around him like a hand. *[BO]"Do you really want to spend the rest of your days knowing you could have saved them, and chose not to? That the chance was right there, in your hands, and you threw it away? No one else will ever be given this choice, Rinaldo. Only you. And if you refuse it, you'll know it forever — not a doubt that fades with time. A certainty you'll carry to bed with you, every night, for the rest of your life."*

In the white, his children wait. They don't call out. They don't move toward him. They wait the way things wait when they haven't yet decided whether they're alive or not.` } },
      { img: 'assets/storia/scena19/panel-19e.jpg', text: { it: `Poi, all'improvviso, non ci sono più due voci distinte.

Beatrice e la Borda — le due metà di lei, una accanto all'altra fino a un istante prima — cominciano a tremare ai bordi, a perdere il contorno netto che le ha tenute separate per tutta la scena. Si sovrappongono. Non si fondono del tutto, non ancora, ma per un battito, poi un altro, Rinaldo non riesce più a dire dove finisce il corpo reale di sua moglie e dove comincia la sagoma incappucciata — sono la stessa immagine, sdoppiata e ributtata contro se stessa, come uno specchio rotto che mostra due volte la stessa cosa.

[[OV:Uccidimi—|—risparmiami—]]

[[OV:Fermami—|—resta con me—]]

Le voci si accavallano, si spezzano, tornano — non più un dialogo, non più due persone che parlano a turno, ma un unico suono che si contraddice da solo, in loop, sempre più vicino, finché Rinaldo non riesce più a isolare una singola parola dal resto.`, en: `Then, suddenly, there are no longer two distinct voices.

Beatrice and the Borda — the two halves of her, side by side until a moment before — begin to tremble at the edges, losing the sharp outline that has kept them separate through the whole scene. They overlap. They don't fully merge, not yet, but for one beat, then another, Rinaldo can no longer say where his wife's real body ends and the hooded shape begins — they are the same image, doubled and thrown back against itself, like a broken mirror showing the same thing twice.

[[OV:Kill me—|—spare me—]]

[[OV:Stop me—|—stay with me—]]

The voices overlap, break apart, come back — no longer a dialogue, no longer two people speaking in turn, but a single sound contradicting itself, looping, closer and closer, until Rinaldo can no longer isolate a single word from the rest.` } },
      { img: 'assets/storia/scena19/panel-19f.jpg', text: { it: `Cade in ginocchio. Le mani gli salgono alla testa, premono, come se potessero fisicamente tenere dentro qualcosa che sta per rompersi.

*[R]"Basta,"* grida — non più una parola, un suono strappato. *[R]"Basta! Non capisco più. Non capisco più niente. Lasciatemi... lasciatemi in pace!"*

Per un istante, tutto tace.

Poi le due immagini si separano di nuovo, lentamente — Beatrice, intera, ferma; la Borda, immobile, più in là.`, en: `He falls to his knees. His hands rise to his head, pressing, as if they could physically hold in something about to break.

*[R]"Enough,"* he screams — no longer a word, a torn sound. *[R]"Enough! I don't understand anymore. I don't understand anything anymore. Leave me... leave me alone!"*

For an instant, everything falls silent.

Then the two images separate again, slowly — Beatrice, whole, still; the Borda, motionless, further off.` } },
      { img: 'assets/storia/scena19/panel-20.jpg', text: { it: `Nel silenzio che segue, Rinaldo capisce che qualunque cosa deciderà adesso, la deciderà così: sfinito, spezzato, senza più la lucidità con cui ha affrontato ogni altra scelta di questo viaggio. Si rialza, o ci prova — le gambe che tremano più per quell'ultimo istante che per la stanchezza del combattimento. Guarda i suoi figli. Poi guarda lei — le due metà di lei, una accanto all'altra per la prima e ultima volta.`, en: `In the silence that follows, Rinaldo understands that whatever he decides now, he will decide it like this: exhausted, broken, without the clarity he's brought to every other choice on this journey. He gets up, or tries to — his legs trembling more from that last instant than from the fatigue of the fight. He looks at his children. Then he looks at her — the two halves of her, side by side for the first and only time.` } }
    ]

  {
    id: 'S19B',
    title: { it: 'Scena 19B — Quello Che Rimane (se Rinaldo uccide Beatrice)', en: 'Scene 19B — What Remains (if Rinaldo kills Beatrice)' },
    panels: [
      { img: 'assets/storia/scena19b/panel-01.jpg', text: { it: `Non lo dice ad alta voce. Non ce n'è bisogno — non più, non dopo tutto quello che si sono appena detti.

Si volta verso Beatrice. Non verso la sagoma ferma nel bianco, ancora bloccata, ancora incapace di avvicinarsi — verso di lei. È lei che glielo ha chiesto. È lei che deve fermare.

Alza quello che ha in mano. Le braccia gli tremano, ma non per la fatica del combattimento appena finito — per il peso di quello che sta per fare con mani che hanno passato una vita a curare, non a togliere.`, en: `He doesn't say it out loud. There's no need to — not anymore, not after everything they've just said to each other.

He turns to face Beatrice. Not the motionless shape in the white, still held back, still unable to come closer — her. She's the one who asked him to. She's the one he has to stop.

He raises what he's holding. His arms shake, but not from the fatigue of the fight just finished — from the weight of what he's about to do with hands that have spent a lifetime healing, not taking.` } },
      { img: 'assets/storia/scena19b/panel-02.jpg', text: { it: `Beatrice non arretra. Non chiude gli occhi. Lo guarda — lo sguardo di sua moglie, intera, senza più niente a coprirlo — e in quello sguardo c'è qualcosa che assomiglia, più di ogni altra cosa vista fino a qui, a una gratitudine.

Fa un passo verso di lui — non per fermarlo. Gli prende la mano libera, poi quella che stringe l'arma, e la guida con la stessa dolcezza di sempre, la stessa di quando gli mostrava come si tagliano le erbe con la lama giusta, il gesto preciso e leggero che serve a non sciupare il gambo — non come si fa la cosa più tremenda della sua vita.

*"Andrà tutto bene,"* dice — la voce ferma, quasi consolatoria. Non lo dice per farsi consolare lei. Lo dice per lui.`, en: `Beatrice doesn't step back. She doesn't close her eyes. She looks at him — her whole self looking back, nothing left to cover it — and in that look there's something that resembles, more than anything else he's seen so far, gratitude.

She takes a step toward him — not to stop him. She takes his free hand, then the one gripping the weapon, and guides it with the same gentleness as always, the same she used to show him how to cut herbs with the right blade, the precise, light motion that keeps from bruising the stem — not how to do the most terrible thing of her life.

*"It'll be alright,"* she says — her voice steady, almost comforting. She isn't saying it to comfort herself. She's saying it for him.` } },
      { img: 'assets/storia/scena19b/panel-03.jpg', text: { it: `Non chiede di aspettare. Non chiede scusa. Non c'è più tempo per nessuna delle due cose, e forse non ce n'è mai stato.

Il braccio di Rinaldo si blocca a metà del gesto — il corpo che si rifiuta, all'ultimo istante, di fare quello che la mente ha già deciso. Beatrice se ne accorge prima di lui. Si muove con uno scatto fulmineo, le mani che raggiungono le sue e le tengono ferme, salde, sopra il pomo dell'arma.

*"Non ti preoccupare, amore,"* dice, piano, il viso vicino al suo. *"Sono qui."*

È l'ultimo gesto d'amore che riesce a farle: aiutarlo lei stessa a compiere il proprio destino. Il colpo arriva con le mani di entrambi sull'arma — le sue sopra quelle di lui, fino all'ultimo istante.`, en: `She doesn't ask him to wait. She doesn't ask for forgiveness. There's no more time for either, and maybe there never was.

Rinaldo's arm locks halfway through the motion — his body refusing, at the last instant, to do what his mind has already decided. Beatrice notices before he does. She moves with a lightning-quick motion, her hands reaching his and holding them steady, firm, over the weapon's pommel.

*"Don't worry, my love,"* she says, quietly, her face close to his. *"I'm here."*

It's the last act of love she manages to give him: helping him herself to carry out his own fate. The blow arrives with both their hands on the weapon — hers over his, until the very last instant.` } },
      { img: 'assets/storia/scena19b/panel-04.jpg', text: { it: `Beatrice non smette di guardarlo — nemmeno ora, nemmeno mentre le forze cominciano a lasciarla. Poi lo attira a sé, un'ultima volta, e lo bacia.

Non è un bacio di commiato come tutti gli altri. Nel momento stesso in cui le labbra si toccano, Rinaldo sente — dentro la propria bocca, mescolato al proprio respiro — l'ultimo respiro di lei. Non se ne va nel nulla, nella nebbia, in nessun altrove. Va in lui. È l'ultima cosa che Beatrice sceglie di dargli, e lo sceglie fino alla fine: anche il proprio ultimo respiro non vuole lasciarlo andare da nessun'altra parte se non dentro l'uomo che ama.`, en: `Beatrice doesn't stop looking at him — not even now, not even as her strength begins to leave her. Then she pulls him to her, one last time, and kisses him.

It isn't a farewell kiss like any other. In the very instant their lips touch, Rinaldo feels — inside his own mouth, mixed with his own breath — her last breath. It doesn't go out into nothing, into the fog, into any elsewhere. It goes into him. It's the last thing Beatrice chooses to give him, and she chooses it to the very end: even her last breath refuses to go anywhere but into the man she loves.` } },
      { img: 'assets/storia/scena19b/panel-05.jpg', text: { it: `Nel bianco, alle sue spalle, la sagoma immobile smette di esistere nello stesso istante — non crolla, non grida. Semplicemente, come una fiamma spenta da un soffio che nessuno ha sentito arrivare, non c'è più.

Nello stesso istante, più indietro nel bianco, le due sagome sospese dei suoi figli — indistinte, mai avvicinabili, viste come attraverso un vetro appannato fin da quando le ha scorte la prima volta — si spengono anche loro, insieme a lei. Nessun sussulto, nessun grido: due fiammelle spente dallo stesso soffio che ha spento la Borda. Rinaldo le vede sparire. Non fa in tempo a capire davvero cosa sta guardando che già non c'è più niente da guardare.

In un solo istante ha perso tutto — Beatrice, i suoi figli, ogni possibilità, per quanto sottile, che fossero ancora vivi da qualche parte. Gli resta solo l'amore che porta per lei, e il ricordo di loro tre insieme, di com'erano prima che tutto questo cominciasse.`, en: `In the white, behind her, the motionless shape ceases to exist in that same instant — it doesn't collapse, doesn't cry out. Simply, like a flame snuffed by a breath no one felt arrive, it isn't there anymore.

In that same instant, further back in the white, the two suspended shapes of his children — indistinct, never approachable, seen as though through fogged glass ever since he first glimpsed them — go out too, together with her. No jolt, no cry: two small flames snuffed by the same breath that snuffed the Borda. Rinaldo watches them disappear. He doesn't even have time to understand what he's looking at before there's nothing left to look at.

In a single instant he has lost everything — Beatrice, his children, every possibility, however thin, that they were still alive somewhere. All that's left to him is the love he carries for her, and the memory of the three of them together, of how they were before any of this began.` } },
      { img: 'assets/storia/scena19b/panel-06.jpg', text: { it: `Il bianco si ritira ai bordi della vista, e sotto ai suoi piedi c'è di nuovo il fango della radura.`, en: `The white recedes to the edges of sight, and beneath his feet is the mud of the clearing again.` } },
      { img: 'assets/storia/scena19b/panel-07.jpg', text: { it: `Il campanellino si spegne.

Non gradualmente — di colpo, come una candela che il vento decide in un solo istante. Caldo, e poi freddo, senza niente in mezzo. La mano di Rinaldo resta dov'è, chiusa intorno al peso piccolo che conosce a memoria, e sente sotto le dita l'esatta differenza tra un attimo prima e un attimo dopo — la stessa differenza che c'è tra una casa abitata e una casa vuota, anche se le mura restano identiche.`, en: `The campanellino goes out. Not gradually — all at once, like a candle the wind decides to end in a single instant. Warm, then cold, nothing in between. Rinaldo's hand stays where it is, closed around the small weight he knows by heart, and he feels beneath his fingers the exact difference between one moment and the next — the same difference there is between a house that's lived in and a house that's empty, even when the walls stay identical.` } },
      { img: 'assets/storia/scena19b/panel-08.jpg', text: { it: `Volta lo sguardo verso il punto dove i suoi figli aspettavano nella nebbia — anche se lo sa già, con la stessa certezza fredda di chi ha appena visto qualcosa sparire con i propri occhi, che non troverà nulla. La nebbia dov'erano è, semplicemente, nebbia — come se non ci fosse mai stato niente lì di diverso da quello che c'è sempre stato.

Si inginocchia. Non è un gesto deciso — è quello che il corpo fa quando le gambe smettono, per un momento, di essere quelle giuste per stare in piedi in un mondo fatto così.

Resta così per un tempo che non prova nemmeno a misurare. Quando si rialza, non è perché ha deciso di farlo. È perché il corpo, alla fine, decide sempre di continuare, anche quando non ne ha più voglia.`, en: `He turns his gaze toward the spot where his children used to wait in the fog — even though he already knows, with the same cold certainty of someone who has just watched something disappear with his own eyes, that he'll find nothing. The fog where they were is, simply, fog — as if there had never been anything there different from what's always been there.

He kneels. It isn't a deliberate gesture — it's what the body does when the legs stop, for a moment, being the right ones to stand on in a world made like this.

He stays like that for a length of time he doesn't even try to measure. When he gets up, it isn't because he decided to. It's because the body, in the end, always decides to go on, even when it doesn't want to anymore.` } },
      { img: 'assets/storia/scena19b/panel-09.jpg', text: { it: `Cammina senza sapere bene verso dove — ma la direzione del fuori, di qualunque cosa esista dall'altra parte di tutto questo, è abbastanza chiara da poter essere seguita anche da chi non ha più niente da cercarci dentro.

La nebbia si dirada piano. Prima alle caviglie, poi alle ginocchia, poi alla vita. Poi quasi sparisce del tutto — resta bassa, sul terreno, come fa d'estate quando si ritira verso il fiume in attesa dell'inverno.

Rinaldo esce.

C'è un campo. C'è una strada che non riconosce e che allo stesso tempo gli sembra di conoscere da sempre, nel modo in cui ogni strada fuori dalla nebbia somiglia a tutte le altre strade fuori dalla nebbia. C'è un cielo che sta ancora decidendo se diventare alba o restare notte un poco più a lungo.

Non si volta indietro.`, en: `He walks without quite knowing where — but the direction of outside, of whatever exists on the other side of all this, is clear enough to follow even for someone who no longer has anything left to search for in it.

The fog thins slowly. First at the ankles, then the knees, then the waist. Then it nearly disappears altogether — staying low, on the ground, the way it does in summer when it withdraws toward the river to wait out the winter.

Rinaldo steps out. There's a field. There's a road he doesn't recognize and that, at the same time, feels like something he's always known, the way every road outside the fog resembles every other road outside the fog. There's a sky still deciding whether to become dawn or stay night a little longer.

He doesn't look back.` } },
      { img: 'assets/storia/scena19b/panel-10.jpg', text: { it: `La nebbia si ritira verso il fiume. Si nasconde tra i canneti.

E aspetta.

*[END]Qui si conclude la storia del Primo Finale.*

Parte la musica dei titoli di coda. Una leggera brezza muove le piccole canne dell'acquitrino.`, en: `The fog withdraws toward the river. It hides among the reeds.

And waits.

*[END]Here concludes the story of the First Ending.*

The end-credits music begins. A gentle breeze moves the small reeds in the marsh.` } }
    ]

  {
    id: 'S19C',
    title: { it: 'Scena 19C — La Corda (se Rinaldo risparmia Beatrice — resta viva come la Borda, per sempre)', en: 'Scene 19C — The Cord (if Rinaldo spares Beatrice — she remains alive as the Borda, forever)' },
    panels: [
      { img: 'assets/storia/scena19c/panel-01.jpg', text: { it: `Abbassa quello che ha in mano.

Non lo decide — succede prima che possa decidere, nello stesso modo in cui succedono le cose che il corpo capisce prima della mente. Nel bianco, i suoi figli aspettano ancora. E lui ha mani precise e nessuna forza nelle braccia, e non è mai stato fatto per le cose che non si possono disfare.`, en: `He lowers what he's holding.

He doesn't decide to — it happens before he can decide, the same way things happen that the body understands before the mind does. In the white, his children are still waiting. And he has precise hands and no strength left in his arms, and he was never made for things that can't be undone.` } },
      { img: 'assets/storia/scena19c/panel-02.jpg', text: { it: `Beatrice lo guarda — ancora reale, ancora intera, ancora sua. Per un istante, negli occhi di lei, non c'è altro che un rifiuto puro, immediato, più forte di qualunque parola.

*"No... Rinaldo... NO!"*

Non è una domanda. È tutto quello che le resta della supplica appena fatta, ridotta a tre sillabe spezzate — perché ha capito, prima ancora che lui la faccia a se stesso, cosa sta scegliendo di fare.`, en: `Beatrice looks at him — still real, still whole, still his. For an instant, in her eyes, there's nothing but pure, immediate refusal, stronger than any word.

*"No... Rinaldo... NO!"*

It isn't a question. It's all that's left of the plea she just made, reduced to three broken syllables — because she has understood, before he's even asked it of himself, what he's choosing to do.` } },
      { img: 'assets/storia/scena19c/panel-03.jpg', text: { it: `*[R]"Va bene,"* dice lui, e la voce che usa non è quella con cui le ha parlato finora — è più dura, quasi estranea a se stesso, come se l'avesse presa in prestito da qualcun altro pur di riuscire a dirla. *[R]"Ridammi i miei figli. E sparisci dalla mia vista."*

Non la guarda — o meglio, prova a non farlo. Le due metà di lei sono ancora entrambe lì, davanti a lui, una accanto all'altra; ma tiene lo sguardo fisso sulla sagoma incappucciata, sulla Borda, sul mostro — su tutto ciò che in quel momento gli permette di non vedere il viso di sua moglie. Prova a trasformare in odio l'amore che prova, perché in questo momento non vuole sentire altro che rabbia. Non vuole amore, non adesso, non per quello che sta facendo. Vuole solo i suoi figli indietro, e si aggrappa a quella rabbia con tutta la forza che gli resta, perché è l'unica cosa che gli impedisce di pensare a cos'altro sta scegliendo insieme a loro.`, en: `*[R]"Fine,"* he says, and the voice he uses isn't the one he's spoken to her with until now — it's harder, almost foreign to himself, as if he'd borrowed it from someone else just to manage saying it. *[R]"Give me back my children. And get out of my sight."*

He doesn't look at her — or rather, he tries not to. Both halves of her are still there, in front of him, side by side; but he keeps his gaze fixed on the hooded shape, on the Borda, on the monster — on everything that, in this moment, lets him avoid seeing his wife's face. He tries to turn the love he feels into hatred, because right now he doesn't want to feel anything but anger. He doesn't want love, not now, not for what he's doing. He only wants his children back, and he holds onto that anger with everything he has left, because it's the only thing stopping him from thinking about what else he's choosing along with them.` } },
      { img: 'assets/storia/scena19c/panel-04.jpg', text: { it: `*"No,"* dice Beatrice, e la voce le si spezza in un modo che non ha ancora avuto in tutta la conversazione. *"Ti prego. Non farmi questo."*

Lui non risponde. Non la guarda. Tiene lo sguardo dritto sulla Borda, con tutta la forza che gli resta.

E mentre lo dice — mentre sta ancora dicendolo — comincia a essere risucchiata.

Non cammina, non si allontana come ha fatto la prima volta, sul crinale. Sparisce dentro l'altra sagoma, tirata indietro come qualcosa che non ha mai smesso di appartenerle — la sua forma che si assottiglia, si confonde, si perde nei bordi incappucciati della Borda, finché non c'è più nessuna Beatrice a cui guardare, da nessuna parte.`, en: `*"No,"* says Beatrice, and her voice breaks in a way it hasn't through the whole conversation. *"Please. Don't do this to me."*

He doesn't answer. He doesn't look at her. He keeps his gaze fixed on the Borda, with everything he has left.

And as he says it — as he's still saying it — she begins to be pulled back. She doesn't walk, doesn't draw away the way she did the first time, on the ridge. She disappears inside the other shape, drawn back like something that never stopped belonging to it — her form thinning, blurring, lost in the hooded edges of the Borda, until there is no Beatrice left to look at, anywhere.` } },
      { img: 'assets/storia/scena19c/panel-05.jpg', text: { it: `*[BO]"Hai fatto la scelta giusta, amore mio,"* dice la Borda, mentre Beatrice finisce di sparire dentro di lei.

Rinaldo sa di averla persa per sempre. Quello che restava della sua Beatrice nel campanellino non c'è più — assorbito, ricongiunto, spento come voce distinta. E in quel vuoto improvviso capisce, con una chiarezza che quasi lo spaventa, che l'unica cosa che vuole ancora, in questo momento, è riabbracciare i propri figli.

La Borda se ne accorge — lo legge sul suo viso prima ancora che lui trovi le parole per dirlo.

*[BO]"Tu vuoi loro,"* dice. *[BO]"Vieni a prendere il frutto del nostro amore. Vieni a prendere i nostri figli. Prendili!"*

La corda cade.`, en: `*[BO]"You made the right choice, my love,"* says the Borda, as Beatrice finishes disappearing inside her.

Rinaldo knows he's lost her forever. Whatever remained of his Beatrice in the campanellino is gone now — absorbed, reunited, extinguished as a distinct voice. And in that sudden emptiness he understands, with a clarity that almost frightens him, that the only thing he still wants, in this moment, is to hold his own children again.

The Borda notices — she reads it on his face before he even finds the words to say it.

*[BO]"You want them,"* she says. *[BO]"Come and take the fruit of our love. Come and take our children. Take them!"*

The cord falls.` } },
      { img: 'assets/storia/scena19c/panel-06.jpg', text: { it: `Il bianco si sfalda tutto insieme, come qualcosa che ha finito di avere un motivo per esistere. Sotto ai suoi piedi, di nuovo il fango della radura — la nebbia, intorno, non più leggera di prima.

La Borda si ritira nella nebbia con un sibilo lungo, sottile — e poi una risata, bassa, quasi soddisfatta, che si spegne lentamente man mano che si allontana, fino a confondersi col resto del silenzio.`, en: `The white comes apart all at once, like something that has finished having a reason to exist. Beneath his feet, the mud of the clearing again — the fog around him no lighter than before.

The Borda withdraws into the fog with a long, thin hiss — and then a laugh, low, almost satisfied, fading slowly as she moves away, until it blends back into the rest of the silence.` } },
      { img: 'assets/storia/scena19c/panel-07.jpg', text: { it: `Rinaldo resta fermo. Non sa quanto tempo passa — un tempo che non riesce a misurare, sospeso tra il sollievo di essersi fermato e la paura di aver sbagliato comunque.

Poi, lontano, un suono. Piccolo, sottile, quasi perso nella nebbia — una voce di bambino. Poi un'altra.

Non capisce le parole, non ancora — solo il tono, il ritmo di qualcuno che chiama.

Due sagome, lontanissime, che si fanno via via più nitide mentre la nebbia, davanti a loro, si apre come non ha mai fatto per nessun altro.`, en: `Rinaldo stays still. He doesn't know how much time passes — a stretch he can't measure, suspended between the relief of having stopped and the fear of having been wrong anyway.

Then, far off, a sound. Small, faint, almost lost in the fog — a child's voice. Then another.

He can't make out the words, not yet — only the tone, the rhythm of someone calling out.

Two shapes, very distant, growing steadily clearer as the fog ahead of them parts in a way it has never done for anyone else.` } },
      { img: 'assets/storia/scena19c/panel-08.jpg', text: { it: `*[I]"Papà!"*

La voce di Isabella, questa volta, è chiara. Poi un'altra, sopra la prima — Ludovico.

*[L]"Papà! Papà!"*

Corrono. Rinaldo non riesce a muoversi per un istante che sembra durare più di tutta la notte appena vissuta — poi cade in ginocchio, le braccia già aperte prima ancora che il pensiero le raggiunga.`, en: `*[I]"Papa!"*

Isabella's voice, this time, is clear. Then another, over the first — Ludovico.

*[L]"Papa! Papa!"*

They're running. Rinaldo can't move for an instant that seems to last longer than the entire night he's just lived through — then he drops to his knees, arms already open before the thought even reaches them.` } },
      { img: 'assets/storia/scena19c/panel-09.jpg', text: { it: `I suoi figli lo raggiungono.

Li stringe forte, con tutta la forza che ha — non gli importa più se è troppa, se fa male. Piange senza provare a fermarsi, senza vergogna.

*[I]"Papà,"* dice Isabella contro la sua spalla, la voce che trema più di stanchezza che di paura. *[I]"Abbiamo avuto tanta paura. Non sapevamo dove eravamo. Ci siamo addormentati, e poi ci siamo risvegliati qua. Cos'è successo?"*

Non risponde subito. Non sa nemmeno lui, in questo momento, quale delle mille risposte vere sia quella giusta da dargli.`, en: `His children reach him.

He holds them tight, with everything he has — he no longer cares if it's too much, if it hurts. He cries without trying to stop, without shame.

*[I]"Papa,"* says Isabella against his shoulder, her voice trembling more from exhaustion than fear. *[I]"We were so scared. We didn't know where we were. We fell asleep, and then we woke up here. What happened?"*

He doesn't answer right away. Even he doesn't know, in this moment, which of a thousand true answers is the right one to give.` } },
      { img: 'assets/storia/scena19c/panel-10.jpg', text: { it: `*[I]"Papà,"* dice Isabella, guardandosi intorno con gli occhi ancora gonfi. *[I]"Dov'è la mamma? Come mai sei solo tu?"*

La mano di Rinaldo scende, quasi da sola, verso il campanellino alla cintura — un gesto automatico, ripetuto ormai senza pensarci. *Beatrice, amore mio...*

*[R]"La mamma è partita anche lei, per la guerra,"* dice, la voce che trova le parole con una calma che non sente per niente. *[R]"La notte in cui vi siete addormentati. Sono tornato io, per un po' — hanno chiesto se poteva aiutare l'esercito, e io ho capacità limitate. Sapete che la mamma è sempre stata più brava di me, in tante cose."* Un sorriso che gli costa più di quanto vorrebbe far vedere. *[R]"Per un po' starete con me. Aspetteremo la mamma insieme."*

*[L]"Ma tornerà presto?"* chiede Ludovico, la voce più bassa, più cauta di quella della sorella.

Rinaldo guarda verso la nebbia, verso il punto in cui, poco prima, c'era ancora una corda.

*[R]"Sì,"* dice. *[R]"Tornerà presto."*

Sa che è vero, in un modo che non può spiegare a nessuno dei due, e che vorrebbe non fosse vero allo stesso modo.

*[R]"Ora andiamo a casa,"* dice, e li prende per mano — Ludovico nella destra, Isabella nella sinistra — e si avviano insieme verso la nebbia.

Il campanellino si raffredda lentamente.

Come qualcosa che è stato acceso a lungo e adesso, finalmente, può smettere.`, en: `*[I]"Papa,"* says Isabella, looking around with eyes still swollen. *[I]"Where's mama? How come it's just you?"*

Rinaldo's hand drops, almost on its own, toward the campanellino at his belt — an automatic gesture, repeated so often by now he no longer thinks about it. *Beatrice, my love...*

*[R]"Mama went off too, to the war,"* he says, finding the words with a calm he doesn't feel at all. *[R]"The night you fell asleep. I came back, for a while — they asked if she could help the army, and my own skills are limited. You know mama's always been better than me, at plenty of things."* A smile that costs him more than he'd like to show. *[R]"You'll stay with me for a while. We'll wait for mama together."*

*[L]"But will she come back soon?"* asks Ludovico, his voice lower, more careful than his sister's.

Rinaldo looks toward the fog, toward the spot where, a moment ago, a cord still hung.

*[R]"Yes,"* he says. *[R]"She'll be back soon."*

He knows it's true, in a way he can't explain to either of them, and that he wishes weren't true in the same way.

*[R]"Let's go home now,"* he says, and takes them by the hand — Ludovico in his right, Isabella in his left — and they set off together toward the fog.

The campanellino cools slowly.

Like something that's been burning for a long time and can, finally, stop.` } },
      { img: 'assets/storia/scena19c/panel-11.jpg', text: { it: `Non è la prima notte, e nemmeno una delle prime. È passato abbastanza tempo perché la paura sia diventata abitudine, perché mettere i bambini a letto sia tornato a essere un gesto qualunque — non qualcosa da temere di rompere ogni volta che lo ripete.

La casa è la stessa di sempre. Non svuotata dal tempo, non segnata dall'assenza — vissuta. Il chiodo vicino alla porta, la luce di sera dalla stessa finestra, nello stesso angolo di sempre.`, en: `It isn't the first night, not even one of the first. Enough time has passed for the fear to become habit, for putting the children to bed to become an ordinary gesture again — not something to fear breaking every time he repeats it.

The house is the same as always. Not emptied by time, not marked by absence — lived in. The nail by the door, the evening light from the same window, in the same corner it's always been.` } },
      { img: 'assets/storia/scena19c/panel-12.jpg', text: { it: `Rinaldo li porta a letto alla luce di una candela. Racconta una storia — quasi sempre la stessa, le parole che cambiano solo un poco ogni sera.

Non ricordano niente di quella notte, né di quello che è venuto dopo. Non hanno mai chiesto niente di quello che non riescono a ricordare — sono tornati come si torna da un sonno profondo, con la stanchezza già dissolta e solo il presente davanti a loro.

Lui ricorda tutto.`, en: `Rinaldo puts them to bed by candlelight. He tells a story — almost always the same one, the words changing only a little each evening.

They don't remember anything of that night, or of what came after. They've never asked about anything they can't remember — they came back the way one comes back from a deep sleep, the tiredness already gone, only the present in front of them.

He remembers everything.` } },
      { img: 'assets/storia/scena19c/panel-13.jpg', text: { it: `A metà della storia, senza una vera ragione, si ferma. Le parole si esauriscono, e al loro posto, senza deciderlo, comincia a canticchiare qualcos'altro — una melodia bassa, le parole che non si distinguono bene, coperte dal respiro dei bambini e dal vento fuori. Non sa quando l'ha imparata, né dove, né come. È lì, nella testa, come se ci fosse sempre stata — come se qualcuno gliel'avesse messa senza che lui se ne accorgesse.

I bambini si addormentano, uno dopo l'altro, senza accorgersi di cosa li ha cullati fino in fondo.`, en: `Halfway through the story, for no real reason, he stops. The words run out, and in their place, without deciding to, he begins humming something else — a low melody, the words indistinct, covered by the children's breathing and the wind outside. He doesn't know when he learned it, or where, or how. It's just there, in his head, as if it had always been — as if someone had placed it there without his noticing.

The children fall asleep, one after the other, without realizing what has lulled them all the way under.` } },
      { img: 'assets/storia/scena19c/panel-14.jpg', text: { it: `Continua finché non smettono di muoversi. Poi si alza, piano, per non svegliarli — e invece di soffiare subito sulla candela, si ferma alla finestra.

Fuori, la nebbia è quella di sempre — bassa, immobile, mai del tutto assente da quando è tornato a casa. E da qualche parte dentro di essa, lontano ma non abbastanza, un urlo. Poi un altro, più corto, che si spegne prima di finire.

Non sa se sono davvero grida di bambini, o solo il vento che gioca con quella forma. Non vuole saperlo — non stanotte. La mano scende, quasi da sola, a toccare il campanellino freddo alla cintura — un gesto automatico, ormai, ripetuto mille volte senza pensarci. *Beatrice, amore mio...* Sa solo, con la stessa certezza fredda con cui riconosce il cambiare del vento prima di un temporale, che da qualche parte, questa notte, la Borda ha appena finito di mietere.`, en: `He goes on until they stop moving. Then he gets up, quietly, so as not to wake them — and instead of blowing out the candle right away, he stops at the window.

Outside, the fog is the same as always — low, still, never entirely gone since he came home. And somewhere within it, far but not far enough, a scream. Then another, shorter, dying out before it finishes.

He doesn't know if they're truly children's cries, or only the wind playing at that shape. He doesn't want to know — not tonight. His hand drops, almost on its own, to touch the cold campanellino at his belt — an automatic gesture, by now, repeated a thousand times without thinking. *Beatrice, my love...* He only knows, with the same cold certainty with which he recognizes the wind changing before a storm, that somewhere, tonight, the Borda has just finished her harvest.` } },
      { img: 'assets/storia/scena19c/panel-15.jpg', text: { it: `Soffia sulla candela.

Il buio.

*[END]Qui si conclude la storia del Secondo Finale.*

Non appena la candela si spegne, cala il silenzio — poi il buio. Partono i titoli di coda, con la musica in sottofondo.`, en: `He blows out the candle.

Darkness.

*[END]Here concludes the story of the Second Ending.*

The moment the candle goes out, silence falls — then darkness. The end credits begin, with music underneath.` } }
    ]
  }
];

/* ============================================================
   MOTORE (non serve modificarlo per aggiungere scene)
   ============================================================ */
let flat = [];
SCENES.forEach((scene, si) => {
  scene.panels.forEach((p, pi) => {
    flat.push({ sceneIdx: si, panelIdx: pi, sceneTitle: scene.title, img: p.img, text: p.text });
  });
});

let cur = 0;
let playing = false;
let timer = null;
let lang = localStorage.getItem('wtfd_storia_lang') || 'it';

const imgEl = document.getElementById('panel-img');
const textInner = document.getElementById('text-inner');
const textEl = document.getElementById('panel-text');
const sceneTitleEl = document.getElementById('scene-title');
const progressEl = document.getElementById('progress-label');
const playBtn = document.getElementById('play-btn');
const langBtn = document.getElementById('lang-toggle');
const chaptersBtn = document.getElementById('chapters-toggle');
const chaptersOverlay = document.getElementById('chapters-overlay');
const chaptersPanel = document.getElementById('chapters-panel');
const resumeBanner = document.getElementById('resume-banner');
const resumeText = document.getElementById('resume-text');
const resumeRestart = document.getElementById('resume-restart');

const UI = {
  it: {
    back: '&larr; Indietro', panel: 'Pannello', of: '/', chapters: '&#9776; Capitoli', resume: 'Hai ripreso da: ', restart: 'Ricomincia da capo'
  },
  en: {
    back: '&larr; Back', panel: 'Panel', of: '/', chapters: '&#9776; Chapters', resume: 'Resumed from: ', restart: 'Start over'
  }
};

const PROGRESS_KEY = 'wtfd_storia_progress';

function readingDurationMs(text) {
  const words = text.trim().split(/\s+/).length;
  const secs = Math.max(5, Math.min(28, words / 2.6));
  return secs * 1000;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderText(raw) {
  return escapeHtml(raw)
    .replace(/\[\[OV:(.+?)\|(.+?)\]\]/g, '<span class="voice-overlap"><em class="ov-a">$1</em><em class="spk-BO ov-b">$2</em></span>')
    .replace(/\*\[(\w{1,2})\](.+?)\*/g, '<em class="spk-$1">$2</em>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '<br><br>');
}

function applyLangChrome() {
  document.querySelector('#topbar a').innerHTML = UI[lang].back;
  langBtn.textContent = lang === 'it' ? 'EN' : 'IT';
  chaptersBtn.innerHTML = UI[lang].chapters;
  document.documentElement.lang = lang;
}

function saveProgress() {
  localStorage.setItem(PROGRESS_KEY, String(cur));
}

function loadProgress() {
  const v = localStorage.getItem(PROGRESS_KEY);
  const n = v === null ? NaN : parseInt(v, 10);
  return (isNaN(n) || n < 0 || n >= flat.length) ? null : n;
}

function buildChaptersMenu() {
  chaptersPanel.innerHTML = '';
  SCENES.forEach((scene, si) => {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    const firstFlatIdx = flat.findIndex(f => f.sceneIdx === si);
    item.innerHTML = '<span>' + scene.title[lang] + '</span><span class="chip">' + scene.panels.length + ' ' + (lang === 'it' ? 'pannelli' : 'panels') + '</span>';
    item.addEventListener('click', () => {
      closeChaptersMenu();
      show(firstFlatIdx);
      setPlaying(true);
    });
    chaptersPanel.appendChild(item);
  });
}

function openChaptersMenu() { buildChaptersMenu(); chaptersOverlay.classList.add('open'); }
function closeChaptersMenu() { chaptersOverlay.classList.remove('open'); }

function show(index) {
  if (index < 0) index = 0;
  if (index >= flat.length) index = flat.length - 1;
  cur = index;
  const item = flat[cur];

  imgEl.classList.remove('visible');
  textInner.classList.remove('visible');

  const img = new Image();
  img.onload = () => { imgEl.src = item.img; imgEl.classList.add('visible'); };
  img.src = item.img;

  textEl.innerHTML = renderText(item.text[lang]);
  sceneTitleEl.textContent = item.sceneTitle[lang];
  progressEl.textContent = UI[lang].panel + ' ' + (item.panelIdx + 1) + UI[lang].of + SCENES[item.sceneIdx].panels.length;

  requestAnimationFrame(() => textInner.classList.add('visible'));

  if (cur + 1 < flat.length) { const pre = new Image(); pre.src = flat[cur + 1].img; }

  saveProgress();
  if (playing) scheduleNext();
}

function scheduleNext() {
  clearTimeout(timer);
  const duration = readingDurationMs(flat[cur].text[lang]);
  timer = setTimeout(() => { if (playing) show(cur + 1); }, duration);
}

function setPlaying(val) {
  playing = val;
  playBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
  if (playing) scheduleNext();
  else clearTimeout(timer);
}

function setLang(l) {
  lang = l;
  localStorage.setItem('wtfd_storia_lang', l);
  applyLangChrome();
  // ridisegna il pannello corrente nella nuova lingua senza avanzare
  const item = flat[cur];
  textEl.innerHTML = renderText(item.text[lang]);
  sceneTitleEl.textContent = item.sceneTitle[lang];
  progressEl.textContent = UI[lang].panel + ' ' + (item.panelIdx + 1) + UI[lang].of + SCENES[item.sceneIdx].panels.length;
  if (playing) scheduleNext();
}

document.getElementById('prev-btn').addEventListener('click', () => show(cur - 1));
document.getElementById('next-btn').addEventListener('click', () => show(cur + 1));
playBtn.addEventListener('click', () => setPlaying(!playing));
langBtn.addEventListener('click', () => setLang(lang === 'it' ? 'en' : 'it'));
chaptersBtn.addEventListener('click', () => { if (chaptersOverlay.classList.contains('open')) closeChaptersMenu(); else openChaptersMenu(); });

applyLangChrome();

const resumeIdx = loadProgress();
if (resumeIdx !== null && resumeIdx > 0) {
  const item = flat[resumeIdx];
  resumeText.textContent = UI[lang].resume + item.sceneTitle[lang];
  resumeBanner.classList.add('open');
  resumeRestart.addEventListener('click', () => {
    resumeBanner.classList.remove('open');
    show(0);
  });
  show(resumeIdx);
} else {
  show(0);
}
</script>
</body>
</html>
